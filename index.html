<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매일 불어 테스트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#e2701b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매일 불어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e4ded3;--accent:#e2701b;--accent-ink:#fff;--soft:#fbeee2;--good:#16815a;--good-soft:#e3f4ec;--bad:#c8372d;--bad-soft:#fbe6e4;--masc:#1f63d6;--fem:#d6304a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#22201d;--ink:#f1ede6;--muted:#a49d92;--line:#38342f;--accent:#f08a3c;--accent-ink:#1a120b;--soft:#3a2a1d;--good:#4cc28c;--good-soft:#16302a;--bad:#ef6a5f;--bad-soft:#3a1d1a;--masc:#6ea8ff;--fem:#ff7286}}
:root[data-theme="dark"]{--bg:#171614;--card:#22201d;--ink:#f1ede6;--muted:#a49d92;--line:#38342f;--accent:#f08a3c;--accent-ink:#1a120b;--soft:#3a2a1d;--good:#4cc28c;--good-soft:#16302a;--bad:#ef6a5f;--bad-soft:#3a1d1a;--masc:#6ea8ff;--fem:#ff7286}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.flag{display:flex;height:22px;width:33px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}.flag i:nth-child(1){background:#f77f00}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#009e60}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav button{flex:1;max-width:128px;background:none;border:0;padding:8px 2px 12px;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:600}
nav button span{white-space:nowrap}nav button[data-tab=listen] span,nav button[data-tab=diary] span{font-size:11px;letter-spacing:-.05em}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:2px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.big{width:100%;padding:14px;font-size:17px}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.accents{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.accents button{font:inherit;min-width:34px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer}
.check{display:grid;gap:8px}
.check div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.check .done{background:var(--good-soft)}
.check span.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.check .done span.dot{background:var(--good);border-color:var(--good);color:#fff}
.stat{display:flex;gap:8px}
.stat div{flex:1;background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .fr{font-weight:600;word-break:break-word}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--soft);color:var(--accent);margin-left:4px;font-weight:500;white-space:nowrap}
.ib{border:0;background:none;cursor:pointer;font-size:18px;padding:4px;color:var(--ink)}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opts small{display:block;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;padding:9px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}
.ln-top{position:sticky;top:0;z-index:3;background:var(--card);padding-bottom:8px}
.ln-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ln-row{display:flex;width:100%;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-top:1px solid var(--line);padding:13px 4px;cursor:pointer}
.ln-row .ln-t{flex:1;min-width:0}.ln-row .ln-fr{font-size:18px;font-weight:600;line-height:1.3}
.ln-row .ln-p{font-size:13px;color:var(--muted);margin-top:2px}.ln-row .ln-k{font-size:14px;margin-top:2px}
.ln-row{display:block;cursor:default}.ln-row .ln-t{cursor:pointer}.ln-row.on{background:var(--good-soft)}
.ln-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lb{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.lb small{color:var(--muted);font-size:11px}.lb:disabled{opacity:.4;cursor:default}
.lb.fresh{background:var(--good-soft);border-color:var(--good)}
.lb.say.on{border-color:var(--accent);color:var(--accent)}
.lb.rec.going{background:#d93025;border-color:#d93025;color:#fff;animation:mvpulse 1s infinite}
@keyframes mvpulse{50%{opacity:.65}}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:4px 0 12px}
.stat4 b{display:block;font-size:24px;line-height:1.2}.stat4 span{font-size:12px;color:var(--muted)}.stat4 small{display:block;font-size:11px;color:var(--muted)}
.dchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;-webkit-overflow-scrolling:touch}.dchips .chip{flex:none;white-space:nowrap}
.ln-day{display:flex;align-items:center;gap:8px;justify-content:space-between;font-weight:700;padding:14px 4px 6px;border-top:2px solid var(--line);color:var(--accent)}
[data-st]{cursor:pointer}
.bars14{display:flex;align-items:flex-end;gap:3px;height:70px;margin:8px 0 2px}.bars14 div{flex:1;background:var(--line);border-radius:3px 3px 0 0;position:relative;min-height:2px}
.bars14 div i{position:absolute;left:0;right:0;bottom:0;background:var(--good);border-radius:3px 3px 0 0}
.stbox{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.stbox div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stbox b{display:block;font-size:20px}
.tl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tl span{font-size:12px;border-radius:6px;padding:2px 6px;background:var(--soft)}.tl .o{color:var(--good)}.tl .x{color:var(--bad)}
.mv-hist{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:13px}
.mv-hist .mv-h{display:flex;align-items:center;gap:6px;padding:3px 0}.mv-hist .mv-h span{flex:1}
nav button{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer}
.chip small{color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.chip.on small{color:inherit;opacity:.8}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtype{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:6px}
.prompt{font-size:24px;font-weight:600;margin:6px 0 14px;word-break:break-word}
.play{display:flex;gap:8px;margin:8px 0 14px}
.play button{flex:1}
.lopts{display:grid;gap:8px}.lopts.pics{grid-template-columns:repeat(5,1fr)}
.lopt{font:inherit;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;line-height:1.4}
.lopt b{color:var(--accent);margin-right:4px}.lopt:hover:not(:disabled){border-color:var(--accent)}
.lopt.pic5{text-align:center;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}.lopt.pic5 span{font-size:30px;line-height:1.2}
.lopt.sel{border-color:var(--accent);background:var(--soft)}
.dq{margin:16px 0 4px}.dq .lopts{margin-top:8px}.dcons{font-style:italic;margin:6px 0 2px}
.lopt.good{background:var(--good-soft);border-color:var(--good)}.lopt.bad{background:var(--bad-soft);border-color:var(--bad)}.lopt:disabled{cursor:default}
#lplay.on{border-color:var(--accent);color:var(--accent)}
.script{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}.sl{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.fb{border-radius:12px;padding:14px;margin-top:12px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb h3{margin:0 0 6px;font-size:17px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.miss{background:var(--bad);color:#fff;border-radius:4px;padding:0 3px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.score{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.pic{flex:none;display:grid;place-items:center;border-radius:12px;background:var(--soft);overflow:hidden;border:0;padding:0;color:inherit;font:inherit;line-height:1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.s{width:46px;height:46px;font-size:20px;cursor:pointer;letter-spacing:-2px}
.pic.s.none{opacity:.45;font-size:16px}
.pic.l{width:100%;height:190px;font-size:76px;margin-bottom:12px;letter-spacing:6px}
.pic.m{width:100%;height:130px;font-size:54px;margin:8px 0;letter-spacing:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .card{width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent;background:var(--bg)}
.grid img:hover{border-color:var(--accent)}
.adm{margin-left:8px;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:16px;white-space:nowrap;background:var(--card)}
@media(max-width:420px){header{flex-wrap:wrap;row-gap:6px}.adm{margin-left:4px;padding:4px 8px;font-size:12px}h1{font-size:18px;white-space:nowrap}}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;padding:16px;overflow:auto}
.adm:hover{border-color:var(--accent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tiles div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.tiles b{display:block;font-size:22px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:4px 8px;margin-top:4px;line-height:1.45}
.seg.wrap2{flex-wrap:wrap}.seg.wrap2 button{flex:1 1 45%;font-size:14px}
.gram{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px;line-height:1.6}.gram summary{cursor:pointer;font-weight:700;color:var(--accent)}.gram ol{padding-left:18px;margin:8px 0}.gram li{margin-bottom:8px}
.pron{font-size:13px;color:var(--accent);margin:1px 0}.pron.big{font-size:17px;margin:0 0 6px}
.gm{color:var(--masc)}.gf{color:var(--fem)}
.gtag{display:inline-block;font-size:11px;line-height:1.5;font-weight:700;border:1.5px solid currentColor;border-radius:8px;padding:0 5px;margin-left:6px;vertical-align:middle}
.chip.gm:not(.on){color:var(--masc);border-color:var(--masc)}.chip.gf:not(.on){color:var(--fem);border-color:var(--fem)}
.chip.gm.on{background:var(--masc);border-color:var(--masc);color:#fff}.chip.gf.on{background:var(--fem);border-color:var(--fem);color:#fff}
textarea.gm,textarea.gf{font-weight:600;border-width:2px}textarea.gm{border-color:var(--masc)}textarea.gf{border-color:var(--fem)}
.big-fr{font-size:28px;font-weight:700;line-height:1.35;margin:8px 0 4px;word-break:break-word}
.dots{display:flex;gap:7px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.dots i.cur{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.phase{text-align:center;font-size:20px;font-weight:700;padding:12px;border-radius:12px;margin:10px 0 6px}
.phase.listen{background:var(--soft);color:var(--accent)}
.phase.speak{background:var(--good-soft);color:var(--good)}
.phase.again{background:var(--bad-soft);color:var(--bad)}
.cd{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.cd i{display:block;height:100%;background:var(--good);width:0}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ctrl button{padding:12px 2px;font-size:14px}
.clamp{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="flag"><i></i><i></i><i></i></div><div><h1>매일 불어 테스트</h1><div class="muted" id="sub"></div></div><span id="sync" style="margin-left:auto;font-size:18px;cursor:pointer"></span><button class="adm" id="setb" title="설정 (목소리·동기화·백업)" style="cursor:pointer;font:inherit;font-size:13px">⚙️</button><button class="adm" id="prof" style="cursor:pointer;font:inherit;font-size:13px"></button><a href="#admin" class="adm" id="adm">🔒 관리자</a></header>
  <div id="inapp" class="card" style="display:none;border-color:var(--accent);background:var(--soft)"></div>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
// ---------- 저장소 ----------
// 👤 사람마다 기록을 따로 보관해요 (노형수 = 원래 기록, 백은정 = 새 공간)
const PROFS=[{c:'noh',n:'노형수',e:'👨'},{c:'baek',n:'백은정',e:'👩'}];
const PK='frstudy.profile';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
let PROF=lsGet(PK);
const profFirst=!PROF&&!lsGet('frstudy.v1'); // 처음 여는 기기면 누가 쓰는지 물어봐요
if(!PROFS.some(p=>p.c===PROF)){PROF='noh';if(!profFirst)try{localStorage.setItem(PK,PROF)}catch(_){}}
const ME=PROFS.find(p=>p.c===PROF);
const KEY=PROF==='noh'?'frstudy.v1':'frstudy.v1.'+PROF;
const DATAFILE=PROF==='noh'?'data.json':'data-'+PROF+'.json';
const JK=PROF==='noh'?'joined':'joined_'+PROF;
// 백은정: 모든 테스트를 '한국어 보고 불어로 말하기' 한 가지로만
const ONLY_SAY=PROF==='baek';
// '정관사 + 단어 하나'는 단어, 띄어쓴 말이 있으면 문장
const ARTRE=/^(les(?=\s)|le(?=\s)|la(?=\s)|une(?=\s)|un(?=\s)|des(?=\s)|l['’])\s*/i;
const kindOf=f=>f.trim().replace(ARTRE,'').trim().includes(' ')?'문장':'단어';
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
const uid=()=>Math.random().toString(36).slice(2,10);

function seed(){
  const y=daysAgo(1), t=today();
  const mk=(fr,ko,added,e)=>({id:uid(),fr,ko,kind:kindOf(fr),added,right:0,wrong:0,sample:true,img:{t:'emoji',v:e}});
  return {
    items:[
      mk('Bonne arrivée !','잘 오셨어요! (도착 환영 인사)',y,'🤗🧳🏠'),
      mk('On se voit au maquis ce soir ?','오늘 저녁 마키(식당)에서 볼까?',y,'🌙🍽️🐟'),
      mk('Combien ça coûte ?','이거 얼마예요?',y,'🏷️💰❓'),
      mk('le marché','시장',y,'🧺🍌🍅'),
      mk('Je voudrais aller à Cocody, s\'il vous plaît.','코코디에 가고 싶어요.',t,'🚕➡️📍'),
      mk('Il fait très chaud aujourd\'hui.','오늘 정말 덥다.',t,'☀️🥵🌡️'),
      mk('la monnaie','잔돈',t,'🪙🪙💵'),
    ],
    wrong:{}, log:{},
    settings:{strict:false,rate:0.95,voice:'',types:{spell:true,dict:true,both:true,speak:true}}
  };
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return d}catch(e){}return seed()}
function save(){if(typeof onSaved==='function')onSaved();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function fix(){S.settings=S.settings||{};if(S.settings.voiceV!==2){S.settings.voiceV=2;S.settings.voice='';if(S.settings.rate===0.9)S.settings.rate=0.95}S.items.forEach(x=>{if(!x.pack&&!/^p[swgcbvh]\d{3}$/.test(x.id))x.kind=kindOf(x.fr)});S.todos=S.todos||{};S.diary=S.diary||{};S.history=S.history||[];S.settings=S.settings||{};S.wrong=S.wrong||{};S.log=S.log||{};S.stamp=S.stamp||{};S.speak=S.speak||{};S.quiz=S.quiz||{};S.delf=S.delf||{};S.mini=S.mini||{};
  S.settings.wtypes=Object.assign({say:true,speak:true,spell:false,dict:false},S.settings.wtypes||{});S.settings.sp=Object.assign({goalMin:60,goalReps:300,reps:5,pause:'mid',mode:(window.SpeechRecognition||window.webkitSpeechRecognition)?'mic':'auto',show:'text',scope:'least',slowFirst:true,pk:'s',cat:'👋 인사'},S.settings.sp||{})}
fix();

// ---------- 유틸 ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function diffHtml(ans,correct){

    if(/^\s+$/.test(w)||!w)return w;

function editDist(a,b){
  if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[b.length];
}
const SIM_NUM={'1':'un','2':'deux','3':'trois','4':'quatre','5':'cinq','6':'six','7':'sept','8':'huit','9':'neuf','10':'dix','11':'onze','12':'douze','20':'vingt','100':'cent'};
function simWords(s){
  return norm(s,false).replace(/'/g,"' ").split(' ').filter(Boolean)
    .map(w=>SIM_NUM[w]||w.replace(/^(l|d|j|n|s|c|m|t|qu)'$/,'$1e'));
}
const SIM_ART=new Set(['le','la','les','un','une','des','de','du']);
function similarity(a,b){
  const A=simWords(a),B=simWords(b);
  if(!B.length||!A.length)return 0;
  const near=(x,y)=>{if(x===y)return 1;const L=Math.max(x.length,y.length),d=editDist(x,y);
    return (L>=4&&d<=1)||(L>=7&&d<=2)?0.85:0};
  const pool=A.slice();let hit=0,need=0;
  B.forEach(w=>{const wt=SIM_ART.has(w)?0.5:1;need+=wt;
    let bi=-1,bs=0;pool.forEach((x,i)=>{const s=near(x,w);if(s>bs){bs=s;bi=i}});
    if(bi>-1){hit+=bs*wt;pool.splice(bi,1)}});
  const extra=pool.filter(w=>!SIM_ART.has(w)).length;
  const wordScore=hit/(need+extra*0.5);
  // 글자 단위로도 비교해서 띄어쓰기·연음 차이를 덮어요
  const ca=A.join(''),cb=B.join(''),charScore=1-editDist(ca,cb)/Math.max(ca.length,cb.length);
  return Math.max(0,Math.min(1,Math.max(wordScore,charScore)));
}

function ttsParts(t){
  t=String(t).trim();if(t.length<=160)return [t];

  const add=x=>{if(cur&&(cur+x).length>160){out.push(cur.trim());cur=''}cur+=x};

const isIOSDev=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

async function micTrack(always){

    let list=(await md.enumerateDevices()).filter(d=>d.kind==='audioinput');
    if(!list.some(d=>d.label)){(await md.getUserMedia({audio:true})).getTracks().forEach(t=>t.stop());list=(await md.enumerateDevices()).filter(d=>d.kind==='audioinput')}

    if(!always&&!list.some(d=>MIC_PHONE.test(d.label)))return null; // 아이폰 마이크가 없으면 평소대로 (녹음은 항상 콕 집어요)
    const real=list.filter(d=>d.deviceId!=='default'&&d.deviceId!=='communications'&&!MIC_PHONE.test(d.label)&&!MIC_VIRTUAL.test(d.label));
    const def=list.find(d=>d.deviceId==='default'),same=def&&real.find(d=>def.label.includes(d.label));

async function gRun(){

          <div class="row"><button class="btn" id="selfno" style="flex:1">😓 몰랐어요</button><button class="btn" id="selfok" style="flex:1">😀 말했어요 → 확인</button></div>`}`;

}
function record(r){
  const it=byId(r.id);if(!it)return;
  T.res.push(r);
  const at=it.att||(it.att=[]);at.push({d:today(),t:r.type,ok:!!r.ok});if(at.length>60)at.splice(0,at.length-60);
  if(r.ok){it.right++;const w=S.wrong[r.id];if(w){w.streak=(w.streak||0)+1;if(w.streak>=2){delete S.wrong[r.id];r.cleared=true}}}
  else{it.wrong++;const w=S.wrong[r.id]||{count:0};w.count++;w.streak=0;w.last=today();S.wrong[r.id]=w}
  save();
}
function next(){record(T.cur);T.cur=null;T.i++;if(T.i>=T.qs.length)finish();else vQuestion()}
function finish(){
  if(T.cur&&T.answered){record(T.cur);T.cur=null}
  T.done=true;
  const score=T.res.filter(r=>r.ok).length;
  if(T.session&&T.session!=='words'&&T.res.length){const l=S.log[today()]||(S.log[today()]={});l[T.session]={score,total:T.res.length}}
  if(T.res.length)S.history.push({d:today(),at:timeNow(),s:T.session||'review',score,total:T.res.length,wrong:[...new Set(T.res.filter(r=>!r.ok).map(r=>r.id))]});
  save();renderNav();vResult();
}
function vResult(){
  const score=T.res.filter(r=>r.ok).length,tot=T.res.length,wrongs=T.res.filter(r=>!r.ok),cleared=T.res.filter(r=>r.cleared);
  $('#view').innerHTML=`
  <div class="card" style="text-align:center"><div class="muted">${T.wrongOnly?'📕 오답 복습':T.session==='mine'?'📝 내 표현 시험':T.session==='words'?'🔤 단어 시험':T.session==='morning'?'☀️ 아침 테스트':'🌙 저녁 테스트'} 결과</div>
    <div class="score">${score} / ${tot}</div>
    <div>${tot&&score===tot?'완벽해요! Bravo ! 👏':score/tot>=.7?'잘했어요! Très bien !':'괜찮아요, 틀린 건 오답노트에서 다시 봐요 💪'}</div>
    ${cleared.length?`<div class="muted" style="margin-top:6px">✨ ${cleared.length}개가 오답노트에서 졸업했어요 (2번 연속 정답)</div>`:''}
  </div>
  ${wrongs.length?`<div class="card"><h2>틀린 것 (${wrongs.length})</h2>${[...new Set(wrongs.map(r=>r.id))].map(byId).filter(Boolean).map(itemRow).join('')}</div>`:''}
  <div class="row">${wrongs.length?`<button class="btn pri" id="again" style="flex:1">📕 틀린 것만 다시</button>`:''}<button class="btn" id="home" style="flex:1">📝 테스트 화면으로</button></div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.remove());
  const ag=$('#again');if(ag)ag.onclick=()=>startTest(true);

var MV={db:null,rec:null,id:null,timer:0,url:null};

function mvSum(){try{return JSON.parse(localStorage.getItem(MVS_KEY))||{}}catch(_){return {}}}
function mvSumSet(id,all){const s=mvSum();if(all.length)s[id]={n:all.length,first:all[0].at,last:all[all.length-1].at};else delete s[id];try{localStorage.setItem(MVS_KEY,JSON.stringify(s))}catch(_){}}
function mvWhen(t){const d=new Date(t),n=new Date();const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return d.toDateString()===n.toDateString()?'오늘 '+hm:(d.getMonth()+1)+'/'+d.getDate()+' '+hm}
function mvDB(){
  if(!MV.db){MV.db=new Promise((res,rej)=>{const r=indexedDB.open('frstudy.voice',1);
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore('rec',{keyPath:'n',autoIncrement:true});s.createIndex('k','k')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});MV.db.catch(()=>{MV.db=null})}

async function mvDel(id,ns){const db=await mvDB();
  // 다른 기기에도 올라간 녹음이면, 클라우드에서도 지우도록 적어 둬요
  const gone=(await mvAll(id)).filter(r=>ns.includes(r.n)&&r.synced&&r.rid).map(r=>mvPath(id,r));
  if(gone.length){mvTombSet([...new Set(mvTombs().concat(gone))]);mvSyncSoon()}
  await new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');ns.forEach(n=>t.objectStore('rec').delete(n));t.oncomplete=res;t.onerror=()=>rej(t.error)});mvSumSet(id,await mvAll(id))}
async function mvPut(id,blob,sec){
  const db=await mvDB();
  await new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');const at=Date.now();t.objectStore('rec').add({k:mvK(id),at,blob,type:blob.type,sec,rid:at+'-'+Math.random().toString(36).slice(2,6),synced:false});t.oncomplete=res;t.onerror=()=>rej(t.error)});
  let all=await mvAll(id);
  if(all.length>20){await mvDel(id,all.slice(1,all.length-19).map(r=>r.n));all=await mvAll(id)}

// 📈 지금까지의 녹음: 첫 녹음과 최근 녹음을 비교해서 얼마나 늘었는지 들어 봐요
// ☁️ 녹음 동기화: 단어와 같은 비공개 저장소(language-data)의 voice/<사람>/ 폴더에 올리고 받아와요
const MVD_KEY='frstudy.voice.del.'+PROF;
function mvTombs(){try{return JSON.parse(localStorage.getItem(MVD_KEY))||[]}catch(_){return []}}
function mvTombSet(a){try{localStorage.setItem(MVD_KEY,JSON.stringify(a))}catch(_){}}
const mvEnc=id=>encodeURIComponent(id).replace(/%/g,'~'),mvDec=s=>{try{return decodeURIComponent(s.replace(/~/g,'%'))}catch(_){return s}};
const mvExt=t=>/mp4|m4a|aac/.test(t||'')?'m4a':/ogg/.test(t||'')?'ogg':'webm';
const mvType=e=>({m4a:'audio/mp4',ogg:'audio/ogg',webm:'audio/webm'})[e]||'audio/webm';
const mvPath=(id,r)=>`voice/${PROF}/${mvEnc(id)}/${r.rid}.${mvExt(r.type)}`;
const mvUrlPath=p=>p.split('/').map(encodeURIComponent).join('/');
function mvGh(path,opt){opt=opt||{};return fetch(`https://api.github.com/repos/${SYNC.repo}/${path}`,{cache:'no-store',method:opt.method||'GET',body:opt.body,
  headers:Object.assign({Authorization:'Bearer '+SYNC.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})})}
async function mvRecs(){const db=await mvDB();return new Promise((res,rej)=>{const q=db.transaction('rec').objectStore('rec').index('k').getAll(IDBKeyRange.bound(PROF+':',PROF+':￿'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function mvSave(r){const db=await mvDB();await new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');t.objectStore('rec').put(r);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function mvRemove(ns){const db=await mvDB();await new Promise((res,rej)=>{const t=db.transaction('rec','readwrite');ns.forEach(n=>t.objectStore('rec').delete(n));t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const mvB64=blob=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(',')[1]||'');f.onerror=()=>rej(f.error);f.readAsDataURL(blob)});
var mvSyncing=null,mvSyncAgain=false,mvSyncT=0;
function mvSyncSoon(){clearTimeout(mvSyncT);mvSyncT=setTimeout(()=>mvSync(),1500)}
function mvSync(){
  if(typeof syncOn!=='function'||!syncOn()||!window.indexedDB)return Promise.resolve();
  if(mvSyncing){mvSyncAgain=true;return mvSyncing}
  mvSyncing=mvSyncRun().catch(e=>console.warn('녹음 동기화',e)).finally(()=>{mvSyncing=null;if(mvSyncAgain){mvSyncAgain=false;mvSyncSoon()}});
  return mvSyncing;
}
async function mvSyncRun(){
  const pre=`voice/${PROF}/`,remote=new Map();let full=true;
  const tr=await mvGh('git/trees/HEAD?recursive=1');
  if(tr.ok){const j=await tr.json();full=!j.truncated;for(const t of j.tree||[])if(t.type==='blob'&&t.path.startsWith(pre))remote.set(t.path,t.sha)}
  else if(tr.status!==404&&tr.status!==409)throw new Error('목록 '+tr.status);
  const changed=new Set();
  // 1) 이 기기에서 지운 녹음은 클라우드에서도 지워요
  let tombs=mvTombs();
  for(const p of tombs.slice()){
    const sha=remote.get(p);
    if(sha){const r=await mvGh('contents/'+mvUrlPath(p),{method:'DELETE',body:JSON.stringify({message:'녹음 지움',sha})});if(!r.ok&&r.status!==404)continue;remote.delete(p)}
    tombs=tombs.filter(x=>x!==p);
  }
  mvTombSet(tombs);const tset=new Set(tombs);
  // 2) 이 기기 녹음: 안 올라간 건 올리고, 다른 기기에서 지운 건 여기서도 지워요
  const local=new Set();
  for(const r of await mvRecs()){
    const id=r.k.slice(PROF.length+1);
    if(!r.rid){r.rid=r.at+'-'+Math.random().toString(36).slice(2,6);r.synced=false;await mvSave(r)}
    const p=mvPath(id,r);local.add(p);
    if(remote.has(p)){if(!r.synced){r.synced=true;r.syncedAt=Date.now();await mvSave(r)}continue}
    if(r.synced){
      if(full&&tr.ok&&Date.now()-(r.syncedAt||r.at)>600000){
        const chk=await mvGh('contents/'+mvUrlPath(p));
        if(chk.status===404){await mvRemove([r.n]);changed.add(id)}
      }
      continue;
    }
    const body=JSON.stringify({message:'녹음: '+id,content:await mvB64(r.blob)});
    let u=await mvGh('contents/'+mvUrlPath(p),{method:'PUT',body});
    if(u.status===409){await new Promise(z=>setTimeout(z,1500));u=await mvGh('contents/'+mvUrlPath(p),{method:'PUT',body})}
    if(u.ok||u.status===422){r.synced=true;r.syncedAt=Date.now();await mvSave(r)}
  }
  // 3) 다른 기기에서 녹음한 건 받아와요
  for(const p of remote.keys()){
    if(local.has(p)||tset.has(p))continue;
    const m=p.slice(pre.length).match(/^([^/]+)\/((\d+)-[^./]+)\.(\w+)$/);if(!m)continue;
    const id=mvDec(m[1]);
    const r=await mvGh('contents/'+mvUrlPath(p),{headers:{Accept:'application/vnd.github.raw+json'}});if(!r.ok)continue;
    const blob=new Blob([await r.arrayBuffer()],{type:mvType(m[4])});
    await mvSave({k:mvK(id),at:+m[3],blob,type:blob.type,rid:m[2],synced:true});changed.add(id);
  }
  for(const id of changed){const all=await mvAll(id);if(all.length>20)await mvDel(id,all.slice(1,all.length-19).map(r=>r.n));else mvSumSet(id,all)}
  if(changed.size&&tab==='listen'&&!MV.rec&&document.getElementById('lnrows'))lnRows();
}
setInterval(()=>{if(tab==='listen'&&document.visibilityState==='visible')mvSync()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tab==='listen')mvSync()});

    <button class="ib" data-act="hp" data-n="${r.n}" title="듣기">▶️</button><button class="ib" data-act="hd" data-n="${r.n}" title="지우기">🗑️</button></div>`).join('');
  row.appendChild(box);
}

const LN_F=[['all','전체'],['new','최근 7일'],['단어','단어'],['문장','문장'],['wrong','틀린 것']];
function lnList(){
  const q=lnKey(LN.q).trim(),from=daysAgo(7);
  return S.items.filter(x=>{
    if(LN.f==='new'&&x.added<from)return false;
    if(LN.f==='wrong'&&!S.wrong[x.id])return false;
    if((LN.f==='단어'||LN.f==='문장')&&x.kind!==LN.f)return false;
    return !q||lnKey(x.fr+' '+x.ko+' '+(x.pron||'')).includes(q);
  }).slice().reverse().sort((a,b)=>a.added<b.added?1:a.added>b.added?-1:0);
}
function lnMark(id){document.querySelectorAll('.ln-row').forEach(b=>{const on=b.dataset.id===id;b.classList.toggle('on',on);const s=b.querySelector('.lb.say');if(s){s.classList.toggle('on',on);s.textContent=on?'🔉 원어민':'🔊 원어민'}})}
function lnStop(){LN.all=false;LN.run++;ttsStop();mvStopPlay();if(MV.rec&&MV.rec.state==='recording')MV.rec.stop();lnMark('');const b=$('#lnall');if(b)b.textContent='▶ 전체 듣기'}
function lnPlay(x,done){
  const run=++LN.run;lnMark(x.id);ttsStop();mvStopPlay();lnAudio.preservesPitch=true;lnAudio.webkitPreservesPitch=true;
  const end=()=>{if(run!==LN.run)return;lnMark('');done&&done()};
  // 기기 음성은 기계음이 심해서 서버 음성을 먼저 써요. 안 되면 기기 음성으로 읽어요.
  const fallback=()=>{if(run!==LN.run)return;if(hasTTS)ttsPlay(x.fr,LN.slow?0.72:S.settings.rate,false,end);else{toast('소리를 불러오지 못했어요');end()}};
  if(!syncOn())return fallback();
  // 아이폰은 누른 순간에 재생을 시작해야 해서, 빈 소리로 먼저 열어 둬요.
  lnAudio.onended=lnAudio.onerror=null;lnAudio.src=LN_SILENT;lnAudio.play().catch(()=>{});
  lnClip(x.fr).then(u=>{if(run!==LN.run)return;lnAudio.onended=end;lnAudio.onerror=fallback;lnAudio.src=u;lnAudio.playbackRate=LN.slow?0.75:1;return lnAudio.play()}).catch(fallback);
}
function lnAll(day){
  if(LN.all){lnStop();return}
  const list=day?lnList().filter(x=>x.added===day):lnList();if(!list.length)return;
  LN.all=true;$('#lnall').textContent='■ 멈추기';let i=0;
  const next=()=>{if(!LN.all)return;if(i>=list.length){lnStop();return}
    const x=list[i++];lnPlay(x,()=>{const run=LN.run;setTimeout(()=>{if(LN.all&&run===LN.run)next()},900)});
    const el=document.querySelector(`.ln-row[data-id="${CSS.escape(x.id)}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})};
  next();
}
function lnRowHtml(x){
  const s=mvSum()[x.id];
  return `<div class="ln-row" data-id="${esc(x.id)}"><div class="ln-t" data-act="say"><div class="ln-fr">${frG(x.fr)}</div>${x.pron?`<div class="ln-p">${esc(x.pron)}</div>`:''}<div class="ln-k">${esc(x.ko)}</div></div>
    <div class="ln-btns"><button class="lb say" data-act="say">🔊 원어민</button>
    <button class="lb" data-act="me" ${s?'':'disabled'}>▶️ 내 목소리${s?` <small>${mvWhen(s.last)}</small>`:''}</button>
    <button class="lb rec" data-act="rec">🎙️ 녹음</button>
    ${s&&s.n>1?`<button class="lb" data-act="hist">📈 ${s.n}번</button>`:''}</div></div>`;
}
function lnRows(){
  const list=lnList(),shown=list.slice(0,300);
  $('#lncount').textContent=list.length+'개';
  const cnt={};list.forEach(x=>cnt[x.added]=(cnt[x.added]||0)+1);let last=null;
  $('#lnrows').innerHTML=shown.length?shown.map(x=>{let hd='';if(x.added!==last){last=x.added;hd=`<div class="ln-day"><span>📅 ${dayFull(x.added)} <small class="muted">${cnt[x.added]}개</small></span><button class="lb" data-dayall="${esc(x.added)}">▶ 이 날 전체 듣기</button></div>`}return hd+lnRowHtml(x)}).join('')+(list.length>300?'<div class="muted" style="padding:10px 4px">앞의 300개만 보여요. 검색으로 찾아 주세요.</div>':''):'<div class="empty">찾는 표현이 없어요</div>';
}
function vListen(){
  mvSync();
  if(!voices.length)loadVoices();
  $('#view').innerHTML=`<div class="card"><div class="ln-top"><h2>듣고 말하기 <small class="muted" id="lncount"></small></h2>
    <div class="muted" style="font-size:13px;margin:-4px 0 8px">🔊 원어민 발음 → 🎙️ 내가 녹음 → ▶️ 내 목소리로 비교해요. 녹음은 이 기기에 저장돼요.</div>
    <input type="search" id="lnq" placeholder="불어, 뜻, 발음으로 찾기" value="${esc(LN.q)}" autocomplete="off">
    <div class="chips" style="margin-top:8px">${LN_F.map(([k,l])=>`<button class="chip ${LN.f===k?'on':''}" data-lf="${k}">${l}</button>`).join('')}</div>
    <div class="ln-tools"><button class="btn sm" id="lnall">▶ 전체 듣기</button><button class="btn sm" id="lnslow">${LN.slow?'🐢 천천히 켜짐':'🐢 천천히'}</button></div>
    </div>

  lnRows();

  document.querySelectorAll('[data-lf]').forEach(b=>b.onclick=()=>{LN.f=b.dataset.lf;lnStop();vListen()});
  $('#lnslow').onclick=()=>{LN.slow=!LN.slow;$('#lnslow').textContent=LN.slow?'🐢 천천히 켜짐':'🐢 천천히'};
  $('#lnall').onclick=()=>lnAll();
  $('#lnrows').onclick=e=>{const da=e.target.closest('[data-dayall]');if(da){lnAll(da.dataset.dayall);return}
    const b=e.target.closest('.ln-row');if(!b)return;const x=S.items.find(i=>i.id===b.dataset.id);if(!x)return;
    const a=e.target.closest('[data-act]'),act=a&&a.dataset.act;if(!act)return;
    if(act==='say'){const same=b.classList.contains('on');LN.all=false;$('#lnall').textContent='▶ 전체 듣기';if(same){lnStop();return}lnPlay(x);return}
    if(act==='me')return mvPlay(x.id);
    if(act==='rec')return mvRecord(x.id);
    if(act==='hist')return mvHist(b,x);
    if(act==='hp')return mvPlay(x.id,+a.dataset.n);
    if(act==='cmp')return mvCompare(x,+a.dataset.n);
    if(act==='hd'){if(!confirm('이 녹음을 지울까요?'))return;mvDel(x.id,[+a.dataset.n]).then(()=>{lnRowRefresh(x.id);const nb=document.querySelector(`.ln-row[data-id="${CSS.escape(x.id)}"]`);if(nb&&mvSum()[x.id])mvHist(nb,x)})}
  };
}

// ---------- 관리자: 나의 모든 기록 ----------
// 주의: 화면 잠금용 비밀번호예요. 파일/브라우저 저장소를 직접 열면 내용을 볼 수 있어요.
const fnv=s=>{let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h.toString(16)};
const PW_DEFAULT='35e15356'; // 기본 비밀번호의 해시값 (원래 숫자는 코드에 남기지 않아요)
let adminOk=false,aTab='day',aDate=null,aQ='';
const WD=['일','월','화','수','목','금','토'];
const fmtD=d=>{const [y,m,dd]=d.split('-').map(Number);return `${y}년 ${m}월 ${dd}일 (${WD[new Date(y,m-1,dd).getDay()]})`};
const shiftD=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);return dstr(new Date(y,m-1,dd+n))};
const timeNow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const MOODS=['🥰','😄','🙂','😐','😕','😢','😤','😴'];
const SUG=['☀️ 아침 테스트','✏️ 새 표현 5개 저장','🌙 저녁 테스트','📕 오답 복습','🎧 불어 라디오·노래 듣기','🗣️ 현지인과 불어로 대화하기'];

function allDates(){
  const s=new Set([...Object.keys(S.log),...S.history.map(h=>h.d),...S.items.map(x=>x.added),

function routineHtml(d){

    +`<span class="tag" style="${n?'':off}">✏️ ${n}개</span>`
    +`<span class="tag" style="${l.evening?'':off}">🌙 ${l.evening?l.evening.score+'/'+l.evening.total:'-'}</span>`
    +`<span class="tag" style="${S.speak[d]?.sec?'':off}">🎧 ${Math.floor((S.speak[d]?.sec||0)/60)}분 · ${S.speak[d]?.reps||0}회</span>`;
}

  const items=S.items.filter(x=>x.added===d);
  let runs=S.history.filter(h=>h.d===d);
  if(!runs.length){const l=S.log[d]||{};runs=['morning','evening'].filter(k=>l[k]).map(k=>({s:k,at:'',score:l[k].score,total:l[k].total,wrong:[]}))}
  const prev=shiftD(d,-1),carry=(S.todos[prev]||[]).filter(t=>!t.done&&!todos.some(x=>x.text===t.text));
  $('#ab').innerHTML=`
  <div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap">
    <button class="btn sm" id="dp">◀</button>
    <div style="text-align:center"><b>${fmtD(d)}</b>${d===today()?' <span class="tag">오늘</span>':''}<br>
      <input type="date" id="dd" value="${d}" style="font:inherit;font-size:13px;border:0;background:none;color:var(--muted)"></div>
    <button class="btn sm" id="dn">▶</button></div>
    <div style="text-align:center;margin-top:8px">${routineHtml(d)}</div>
    ${d!==today()?'<div style="text-align:center;margin-top:8px"><button class="btn sm" id="dt0">오늘로</button></div>':''}
  </div>

  <div class="card"><h2>✅ 할 일 <span class="muted">${todos.filter(t=>t.done).length}/${todos.length}</span></h2>
    ${todos.map(t=>`<div class="item"><input type="checkbox" data-td="${t.id}" ${t.done?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)">
      <div class="t" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.text)}</div><button class="ib" data-tx="${t.id}" title="삭제">✕</button></div>`).join('')||'<div class="muted">아직 할 일이 없어요.</div>'}
    <div class="row" style="margin-top:10px"><input type="text" id="tn" placeholder="할 일 추가" style="flex:1"><button class="btn sm pri" id="ta">추가</button></div>
    <div class="accents" style="margin-top:8px">${SUG.filter(s=>!todos.some(t=>t.text===s)).map(s=>`<button data-ts="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div>
    ${carry.length?`<button class="btn sm" id="tc" style="margin-top:8px">↪ 전날 못한 일 ${carry.length}개 가져오기</button>`:''}
  </div>

  <div class="card"><h2>📔 일기 · 느낀 점</h2>
    <div class="muted" style="margin-bottom:4px">오늘 기분</div>
    <div class="row" style="gap:4px">${MOODS.map(m=>`<button class="ib" data-m="${m}" style="font-size:26px;border-radius:10px;${di.mood===m?'background:var(--soft);outline:2px solid var(--accent)':''}">${m}</button>`).join('')}</div>
    <label class="f">있었던 일, 느낀 점</label>
    <textarea id="dtx" style="min-height:150px" placeholder="오늘 마키에서 'Combien ça coûte ?'를 처음 써봤다. 아주머니가 웃으면서…">${esc(di.text)}</textarea>
    <label class="f">불어 일기 (📔 불어 일기 탭에서 첨삭받기)</label>
    <div class="row" style="align-items:flex-start"><textarea id="dfr" data-fr placeholder="Aujourd'hui, j'ai appris…" style="flex:1;min-height:90px">${esc(di.fr)}</textarea><button class="ib" id="dsay" title="듣기">🔊</button></div>${accBar()}
    <div class="row" style="margin-top:10px;justify-content:space-between"><span class="muted" id="dsv">${di.updated?'저장됨 · '+esc(di.updated):''}</span><button class="btn pri" id="dsave">일기 저장</button></div>

        +Object.entries(sp.by||{}).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([id,n])=>{const it=byId(id);return it?`<div class="muted" style="margin-top:4px">🗣️ ${n}번 · ${esc(it.fr)}</div>`:''}).join('')})()}

  const setTodos=list=>{if(list.length)S.todos[d]=list;else delete S.todos[d];save();keepDiary();aDay()};
  const add=text=>{text=text.trim();if(!text)return;setTodos([...todos,{id:uid(),text,done:false}])};

  }
  let tmr;const auto=()=>{clearTimeout(tmr);tmr=setTimeout(()=>keepDiary(true),700)};
  $('#dtx').oninput=auto;$('#dfr').oninput=auto;
  $('#dsave').onclick=()=>keepDiary(false);
  $('#dsay').onclick=()=>{const v=$('#dfr').value.trim();v?speak(v):toast('불어 문장을 먼저 써보세요')};
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mood=mood===b.dataset.m?'':b.dataset.m;keepDiary(true);aDay()});
  bindRows();
}

  $('#ab').innerHTML=`<div class="card"><input type="text" id="aq" placeholder="🔍 일기 · 할 일 · 표현 검색" value="${esc(aQ)}"></div>`

// ---------- 🎧 스피킹 1시간: 듣고 → 따라 말하고 → 듣고 → 따라 말하고 ----------
var SP=null,spTick=null,wakeLock=null;
const PAUSE={short:1.0,mid:1.5,long:2.2};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const spGet=(d=today())=>S.speak[d]||{sec:0,reps:0,by:{}};
const spDay=(d=today())=>S.speak[d]||(S.speak[d]={sec:0,reps:0,by:{}});
function saidTotal(id){let n=0;for(const d in S.speak)n+=((S.speak[d].by||{})[id]||0);return n}
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);

// 소리 재생이 끝날 때까지 기다리고, 걸린 시간을 돌려줘요 (따라 말할 시간 계산용)
function speakP(text,slow,who){
  return new Promise(res=>{
    const t0=Date.now();
    if(!hasTTS&&!syncOn()){setTimeout(()=>res(1500),1500);return}
    let done=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(t);res(Math.max(800,Date.now()-t0))};
    const t=setTimeout(fin,text.length*(slow?150:110)+9000);
    const device=()=>hasTTS?ttsPlay(text,slow?0.72:S.settings.rate,who,fin):fin();
    if(syncOn())svPlay(text,svRate(slow),who,fin,device);else device();
  });
}
// 내 목소리를 듣고 문장과 얼마나 비슷한지 확인해요
function listenFor(target,ms){
  return new Promise(res=>{
    let best='',done=false,rec,t;
    const fin=()=>{
      if(done)return;done=true;clearTimeout(t);try{rec&&rec.abort()}catch(_){}
      if(SP)SP.rec=null;
      const sim=similarity(best,target);res({heard:best,sim,ok:sim>=0.5});
    };
    try{rec=new SR()}catch(_){res({heard:'',sim:0,ok:true});return}
    rec.lang='fr-FR';rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{
      best=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();
      if(SP)SP.heard=best;const h=$('#spheard');if(h)h.textContent='들린 말: '+best;
      if(e.results[e.results.length-1].isFinal)setTimeout(fin,150);
    };
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){if(SP)SP.micDenied=true}fin()};
    rec.onend=fin;
    t=setTimeout(fin,ms);
    if(SP)SP.rec=rec;
    srStart(rec,()=>done).catch(fin);
  });
}
function waitOrSkip(ms){return new Promise(res=>{const t=setTimeout(res,ms);if(SP)SP.wake=()=>{clearTimeout(t);res()}})}
function spCountdown(ms){
  const i=$('#spcd');if(!i)return;
  i.style.transition='none';i.style.width='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.transition=`width ${ms}ms linear`;i.style.width='100%'}));
}
function spQueue(){
  const c=S.settings.sp;let list=S.items.slice();
  if(c.scope==='today')list=list.filter(x=>x.added===today());
  else if(c.scope==='week')list=list.filter(x=>x.added>=daysAgo(6));
  else if(c.scope==='wrong')list=list.filter(x=>S.wrong[x.id]);
  else if(c.scope==='pack')return packIds().map((id,i)=>[id,saidTotal(id),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(a=>a[0]); // 필수 100: 순서대로, 적게 말한 것부터
  list=shuffle(list);
  // 적게 말한 것부터 (오답노트에 있는 건 더 앞으로)
  if(c.scope==='least'){const score=x=>saidTotal(x.id)-(S.wrong[x.id]?50:0);list.sort((a,b)=>score(a)-score(b))}
  return list.map(x=>x.id);
}
function spCount(id){
  const d=spDay();d.reps++;d.by=d.by||{};d.by[id]=(d.by[id]||0)+1;
  save();spGoalCheck();
}
function spGoalCheck(){
  const d=spGet(),c=S.settings.sp;
  if(SP&&!SP.celebrated&&d.sec>=c.goalMin*60&&d.reps>=c.goalReps){SP.celebrated=true;toast('🎉 오늘 스피킹 분량 완료! Bravo !')}
}
function spSecond(){
  if(!(SP&&SP.running&&document.visibilityState==='visible'))return;
  const d=spDay(),c=S.settings.sp;d.sec++;
  if(d.sec%20===0)save();
  const t=$('#sptime');if(t)t.textContent=mmss(d.sec);
  const b=$('#spbar');if(b)b.style.width=Math.min(100,d.sec/(c.goalMin*60)*100)+'%';
  spGoalCheck();
}
function spAdvance(){SP.rep=0;SP.qi++;if(SP.qi>=SP.queue.length){SP.queue=spQueue();SP.qi=0}}
function spInterrupt(){
  if(!SP)return;SP.token=(SP.token||0)+1;
  ttsStop();
  try{SP.rec&&SP.rec.abort()}catch(_){}
  SP.wake&&SP.wake();
}
async function spLoop(){
  const my=SP.token=(SP.token||0)+1;
  const alive=()=>SP&&SP.running&&SP.token===my;
  while(alive()){
    const it=byId(SP.queue[SP.qi]);
    if(!it){spAdvance();if(!SP.queue.length){spEnd();render();return}continue}
    const c=S.settings.sp;
    SP.phase='listen';SP.heard='';SP.sim=null;spDraw();
    const dur=await speakP(it.fr,c.slowFirst&&SP.rep===0);
    if(!alive())return;
    SP.phase='speak';spDraw();
    const wait=Math.round(Math.max(2200,dur*PAUSE[c.pause]+700));
    spCountdown(wait);
    let r;
    if(c.mode==='mic'&&SR&&!SP.micDenied)r=await listenFor(it.fr,wait+1500);
    else{await waitOrSkip(wait);r={ok:true,heard:''}}
    if(!alive())return;
    if(SP.micDenied&&c.mode==='mic'){c.mode='auto';save();toast('마이크를 쓸 수 없어서 ⏱️ 자동 진행으로 바꿨어요');r.ok=true}
    if(SP.manual){SP.manual=false;r.ok=true}
    SP.sim=r.sim;
    if(r.ok){spCount(it.id);SP.rep++;SP.phase='good'}else SP.phase='again';
    spDraw();
    await sleep(r.ok?450:1000);
    if(!alive())return;
    if(SP.rep>=c.reps)spAdvance();
  }
}
async function spStart(){
  const q=spQueue();
  if(!q.length){toast('연습할 표현이 없어요. "연습할 문장" 범위를 바꿔보세요');return}
  SP={queue:q,qi:0,rep:0,running:true,phase:'listen',heard:'',celebrated:false};
  const d=spGet(),c=S.settings.sp;if(d.sec>=c.goalMin*60&&d.reps>=c.goalReps)SP.celebrated=true;
  try{wakeLock=await navigator.wakeLock?.request('screen')}catch(_){} // 화면 꺼짐 방지
  if(!spTick)spTick=setInterval(spSecond,1000);
  spDraw();spLoop();
}
function spEnd(){
  if(!SP)return;
  SP.running=false;spInterrupt();SP=null;save();
  try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null;
}
function spToggle(){
  if(!SP)return;
  if(SP.running){SP.running=false;spInterrupt();save();spDraw()}
  else{SP.running=true;spDraw();spLoop()}
}
function spManual(){if(SP&&SP.running&&SP.phase==='speak'){SP.manual=true;try{SP.rec&&SP.rec.abort()}catch(_){}SP.wake&&SP.wake()}}
function spSkip(){if(!SP)return;spInterrupt();spAdvance();if(SP.running)spLoop();else spDraw()}
document.addEventListener('keydown',e=>{
  if(tab!=='speak'||!SP||(e.target.matches&&e.target.matches('input,textarea')))return;
  if(e.code==='Space'){e.preventDefault();spToggle()}
  else if(e.key==='Enter'){e.preventDefault();spManual()}
  else if(e.key==='ArrowRight'){e.preventDefault();spSkip()}
});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&SP&&!wakeLock){try{wakeLock=await navigator.wakeLock?.request('screen')}catch(_){}}});

function spDraw(){
  if(tab!=='speak'||!SP)return;
  const it=byId(SP.queue[SP.qi]);if(!it)return;
  const c=S.settings.sp,d=spGet(),im=imgOf(it);
  const reveal=c.show==='text'||SP.rep>0||SP.phase==='good'||SP.phase==='again';
  const ph=!SP.running?['listen','⏸ 일시정지 — ▶️ 계속을 누르세요']
    :{listen:['listen',SP.rep===0&&c.slowFirst?'🔊 잘 들으세요 (천천히)':'🔊 잘 들으세요'],speak:['speak',c.mode==='mic'&&SR?'🗣️ 따라 말하세요! (듣고 있어요)':'🗣️ 따라 말하세요!'],
      good:['speak','✓ 좋아요'+(SP.sim!=null&&c.mode==='mic'?` · ${Math.round(SP.sim*100)}% 일치`:'')],again:['again','🔁 다시 한 번! 조금 더 크게']}[SP.phase];
  $('#view').innerHTML=`
  <div class="card">
    <div class="row" style="justify-content:space-between"><span>⏱️ <b id="sptime">${mmss(d.sec)}</b> / ${c.goalMin}:00</span><span>🗣️ <b id="spreps">${d.reps}</b> / ${c.goalReps}회</span></div>
    <div class="bar" style="margin:6px 0 4px"><i id="spbar" style="width:${Math.min(100,d.sec/(c.goalMin*60)*100)}%;background:var(--good)"></i></div>
    ${picHtml(im,'m')}
    <div class="big-fr" style="text-align:center">${reveal?frG(it.fr):'👂 · · ·'}</div>${reveal&&it.pron?`<div class="pron big" style="text-align:center">[ ${esc(it.pron)} ]</div>`:''}
    <div class="muted" style="text-align:center">${reveal?esc(it.ko):'문장은 숨겨져 있어요. 소리만 듣고 따라 해보세요'}</div>${reveal&&it.note?`<div class="note" style="text-align:center">💡 ${esc(it.note)}</div>`:''}
    <div class="dots">${Array.from({length:c.reps},(_,i)=>`<i class="${i<SP.rep?'on':i===SP.rep?'cur':''}"></i>`).join('')}</div>
    <div class="phase ${ph[0]}">${ph[1]}</div>
    <div class="cd"><i id="spcd"></i></div>
    <div class="muted" id="spheard" style="text-align:center;min-height:22px;margin-top:6px">${SP.heard?'들린 말: '+esc(SP.heard):''}</div>
    <div class="muted" style="text-align:center;font-size:13px">이 표현 총 <b>${saidTotal(it.id)}</b>번 말함 · 오늘 ${(d.by||{})[it.id]||0}번</div>
    <div class="ctrl">
      <button class="btn" id="sppause">${SP.running?'⏸ 멈춤':'▶️ 계속'}</button>
      <button class="btn" id="spcount" ${SP.running&&SP.phase==='speak'?'':'disabled'}>✋ 말했어요</button>
      <button class="btn" id="spnext">⏭ 다음</button>
      <button class="btn" id="spstop">■ 끝내기</button>
    </div>
    <div class="muted" style="text-align:center;margin-top:8px;font-size:12px">키보드: Space 멈춤/계속 · Enter 말했어요 · → 다음 문장</div>
  </div>`;
  $('#sppause').onclick=spToggle;$('#spcount').onclick=spManual;$('#spnext').onclick=spSkip;

Merci beaucoup !|메르시 보쿠|정말 고마워!|💐|beaucoup = 많이.
De rien.|드 리앙|천만에.|😊|de rien = '아무것도 아닌 것(에 대해)' → 천만에.
S'il te plaît.|실 트 플레|부탁해 (친구·아이에게)|🥺|si + il → s'il (모음 앞 축약). '그게 너를 기쁘게 한다면' = 부탁해.
S'il vous plaît.|실 부 플레|부탁합니다 (어른·처음 보는 사람에게)|🙇|te(너) 대신 vous(당신) → 어른·처음 보는 사람에게.
Pardon !|파르동|미안! / 잠깐 지나갈게요|🙇|부딪혔을 때, 지나갈 때, 잘 못 들었을 때 모두 써요.
Excuse-moi.|엑스퀴즈 무아|미안해 / 실례해|😅|excuse(용서해) + moi(나를). 어른께는 Excusez-moi.
Ce n'est pas grave.|스 네 파 그라브|괜찮아, 별거 아니야.|👌|ne … pas = 부정. c'est(그것은 ~이다)를 감싸서 n'est pas.
🧒 나 소개
Comment tu t'appelles ?|코망 튀 타펠|이름이 뭐야?|📛|s'appeler = '자기를 ~라고 부르다'. comment = 어떻게.
Je m'appelle Léa.|주 마펠 레아|내 이름은 레아야. (Léa 자리에 내 이름)|📛|me(나 자신을) + appelle → m'appelle. '나는 나를 레아라고 불러'.
Tu as quel âge ?|튀 아 켈 라주|몇 살이야?|🎂|나이는 avoir(가지다)로 말해요: '몇 살을 가졌니?'
J'ai six ans.|제 시 장|나는 여섯 살이야.|🎂|je + ai(가지다) → j'ai. ans = 해(年). six의 x가 이어져 '시 장'.
Je viens de Corée.|주 비앙 드 코레|나는 한국에서 왔어.|🇰🇷|venir de = ~에서 오다. 이 de는 '~로부터'.
J'habite à Abidjan.|자비트 아 아비장|나는 아비장에 살아.|🇨🇮|도시 앞에는 à(~에). je + habite → j'habite.
Je parle un peu français.|주 파를 앙 푀 프랑세|나는 프랑스어를 조금 해.|🗣️|un peu = 조금. 언어 이름은 소문자로 써요.
C'est ma maman.|세 마 마망|우리 엄마야.|👩|c'est = 이것은 ~이다. ma = 나의 (여성 명사 앞), 남성 앞은 mon.
💬 대답
Oui.|위|응 / 네|✅|네.
Non.|농|아니|❌|아니요.
D'accord.|다코르|알았어 / 좋아|👌|de + accord(동의) → '동의해' = OK.
Bien sûr !|비앙 쉬르|물론이지!|👍|sûr = 확실한 → 물론.
Peut-être.|푀테트르|아마도|🤔|peut(~일 수 있다) + être(이다) = 그럴 수도 있다.
Non, merci.|농, 메르시|아니, 괜찮아 (사양할 때)|🙅|사양할 때. 받을 때는 Oui, merci.
Moi aussi.|무아 오시|나도.|🙋|moi = 나 (강조형). aussi = ~도.
Moi non plus.|무아 농 플뤼|나도 아니야.|🙅|부정 문장에 '나도'는 aussi 대신 non plus.
C'est vrai ?|세 브레|정말이야?|😮|vrai = 진짜인. 끝을 올리면 질문.
Je ne sais pas.|주 느 세 파|몰라.|🤷|savoir(알다). ne … pas로 부정. 빨리 말하면 '셰 파'처럼 들려요.
Pas encore.|파 장코르|아직이야.|⏳|pas = 아니, encore = 아직.
Je suis là !|주 쉬 라|나 여기 있어!|📍|je suis = être(이다/있다)의 je형. là = 여기/거기.
🆘 이해·소통
Je ne comprends pas.|주 느 콩프랑 파|이해가 안 돼.|😵|comprendre(이해하다)를 ne … pas로 감싼 부정.
Tu peux répéter ?|튀 푀 레페테|다시 말해 줄래?|🔁|pouvoir(할 수 있다) + 동사원형 = ~해 줄 수 있어?
Plus lentement, s'il te plaît.|플뤼 랑트망, 실 트 플레|좀 더 천천히 말해 줘.|🐢|plus = 더. lent(느린) + -ment(~하게) = 천천히.
Qu'est-ce que c'est ?|케스 크 세|이게 뭐야?|❓|통째로 '이게 뭐야?'로 외워요.
Ça veut dire quoi ?|사 뵈 디르 쿠아|그게 무슨 뜻이야?|💭|vouloir dire = 의미하다. quoi = 무엇.
Comment on dit ça en français ?|코망 통 디 사 앙 프랑세|이거 프랑스어로 뭐라고 해?|🇫🇷|on = 사람들(일반). dire = 말하다. en + 언어 = ~로.
J'ai compris !|제 콩프리|이해했어!|💡|avoir + 과거분사(compris) = 과거 '이해했다'.
Regarde !|르가르드|봐!|👀|regarder(보다)의 명령형. 어른께는 Regardez !
🙋 필요·부탁
J'ai faim.|제 팽|배고파.|🤤|'배고픔을 가지다'. 배고프다·목마르다·덥다·춥다는 avoir를 써요.
J'ai soif.|제 수아프|목말라.|💧|soif = 갈증. avoir soif = 목마르다.
Je veux de l'eau, s'il te plaît.|주 뵈 드 로, 실 트 플레|물 주세요.|🚰|de l' = '약간의' (물·빵·쌀처럼 셀 수 없는 것 앞).
Je peux aller aux toilettes ?|주 푀 알레 오 투알레트|화장실 가도 돼요?|🚻|aux = à + les. toilettes는 늘 복수형.
Aide-moi, s'il te plaît.|에드 무아, 실 트 플레|도와줘.|🆘|aider(돕다)의 명령형 + moi(나를).
Je peux avoir ça ?|주 푀 아부아르 사|이거 가져도 돼?|🎁|pouvoir + 동사원형. avoir = 가지다.
Donne-moi ça, s'il te plaît.|돈 무아 사, 실 트 플레|그거 줘.|🤲|donner(주다)의 명령형 + moi(나에게).
Attends-moi !|아탕 무아|나 기다려 줘!|✋|attendre(기다리다)의 명령형 + moi.
Je veux ça.|주 뵈 사|이거 할래 / 이거 갖고 싶어.|👉|vouloir(원하다)의 je형 = veux. 어른께는 Je voudrais ça (더 공손).
Encore, s'il te plaît !|앙코르, 실 트 플레|더 줘! / 한 번 더 해 줘!|➕|encore = 더 / 다시.
Je peux venir ?|주 푀 브니르|나도 가도 돼?|🚶|venir = 오다 / (같이) 가다.
J'ai besoin d'aide.|제 브주앙 데드|도움이 필요해.|🙋|avoir besoin de = ~가 필요하다. de + aide → d'aide.
😊 기분·몸
J'ai mal au ventre.|제 말 오 방트르|배 아파.|🤕|avoir mal à = ~가 아프다. au = à + le.
J'ai mal à la tête.|제 말 아 라 테트|머리 아파.|🤕|tête(머리)가 여성이라 à la.
J'ai froid.|제 프루아|추워.|🥶|춥다는 avoir froid (je suis froid라고 하지 않아요).
J'ai chaud.|제 쇼|더워.|🥵|avoir chaud = 덥다.
J'ai sommeil.|제 소메이|졸려.|😴|sommeil = 잠. '잠을 가지다' = 졸리다.
J'ai peur.|제 푀르|무서워.|😨|peur = 두려움. avoir peur = 무섭다.
Je suis malade.|주 쉬 말라드|나 아파 (병났어).|🤒|être + 형용사. malade = 아픈.
Je suis triste.|주 쉬 트리스트|슬퍼.|😢|triste = 슬픈. e로 끝나서 남녀 형태가 같아요.
Je suis fatigué.|주 쉬 파티게|피곤해. (여자: fatiguée, 발음 같아요)|🥱|여자는 끝에 e (fatiguée). 발음은 같아요.
Je suis content.|주 쉬 콩탕|기뻐. (여자: contente)|😄|여자는 contente (콩탕트). 이건 발음이 달라져요.
Je t'aime.|주 템|사랑해.|❤️|te(너를)는 동사 앞. te + aime → t'aime.
Ça fait mal !|사 페 말|아파! (다쳤을 때)|🩹|faire mal = 아프게 하다. '그게 아프게 해!'

Pourquoi ?|푸르쿠아|왜?|❓|왜? 대답은 Parce que … (왜냐하면).

Tu es où ?|튀 에 우|너 어디야?|📱|구어에선 où를 끝에. (Où es-tu ?와 같은 뜻)
Qu'est-ce que tu fais ?|케스 크 튀 페|뭐 해?|👀|faire = 하다. '뭐 해?'를 통째로 외우기.
On y va ?|옹 니 바|갈까?|🚶|on = 우리(구어). y = 거기. '우리 거기 가?' = 갈까?

J'ai fini !|제 피니|다 했어!|✅|finir(끝내다)의 과거.

// ---------- 👂 듣기 평가 (A1~A2): 내가 저장한 표현을 실제 상황 역할극 속에서 들어요 ----------
// 동기화가 연결되어 있으면 Claude가 아비장 생활 상황(시장·택시·교회…) 대화를 만들어 줘요. 안 되면 내 표현으로 기본 문제를 만들어요.
const LTYPES={inference:'🧠 대화를 듣고 추론하기',reply:'💬 대화 끝에 알맞은 대답 고르기',meaning:'🎧 들은 말의 뜻 고르기',detail:'🔎 대화 내용 고르기',situation:'📍 어떤 상황인지 고르기',mean:'🎧 들은 말의 뜻 고르기',heard:'👂 들은 문장 고르기'};
const QUIZ_URL=TR_URL.replace(/\/translate$/,'/quiz');
let L=null;
const pick=(a,n)=>shuffle(a).slice(0,n);
function opts5(right,pool){const o=[right];for(const x of shuffle(pool)){if(o.length>=5)break;if(x&&!o.includes(x))o.push(x)}return shuffle(o)}
function lSource(k){
  const mine=S.items.filter(x=>x.fr&&x.ko);
  const pri=mine.filter(x=>x.added>=daysAgo(13)||S.wrong[x.id]);
  const rest=mine.filter(x=>!pri.includes(x));
  return [...pick(pri,k),...pick(rest,k)].slice(0,k);
}
function lLocal(src,n){
  const all=S.items.filter(x=>x.fr&&x.ko),koPool=[...new Set(all.map(x=>x.ko))],frPool=[...new Set(all.map(x=>x.fr))];
  const pk=Object.values(typeof PITEMS!=='undefined'?PITEMS:{}).filter(x=>x.kind==='문장');
  const Q=[];
  src.slice(0,n).forEach((x,i)=>{
    if(i%2===0)Q.push({t:'mean',say:[x.fr],who:['상대'],fr:[x.fr],ko:[x.ko],ans:x.ko,opts:opts5(x.ko,[...koPool,...pk.map(y=>y.ko)].filter(k=>k!==x.ko)),qtext:'잘 듣고, 알맞은 뜻을 고르세요.',id:x.id});
    else Q.push({t:'heard',say:[x.fr],who:['상대'],fr:[x.fr],ko:[x.ko],ans:x.fr,opts:opts5(x.fr,[...frPool,...pk.map(y=>y.fr)].filter(f=>f!==x.fr)),qtext:'잘 듣고, 들은 문장을 고르세요.',id:x.id});
  });
  return Q;
}
// 🗂️ 문제 은행: 한 번 만든 역할극 문제는 지우지 않고 쌓아서, 복습 때 다시 내요 (기기끼리 동기화)
function qBankRec(q){return {at:today(),t:q.t,scene:q.scene,qtext:q.qtext,say:q.say,who:q.who,ko:q.ko,ans:q.ans,ansKo:q.ansKo,wrong:q.opts.filter(o=>o!==q.ans),explain:q.explain,id:q.id,tries:[]}}
function qFromBank(k){const r=S.quiz[k];return {qid:k,t:r.t,scene:r.scene,qtext:r.qtext,say:r.say,who:r.who,fr:r.say,ko:r.ko,ans:r.ans,ansKo:r.ansKo,opts:shuffle([r.ans,...(r.wrong||[])]),explain:r.explain,id:r.id,ai:true}}
function qStat(){const ks=Object.keys(S.quiz||{});let wrong=0,fresh=0;ks.forEach(k=>{const t=S.quiz[k].tries||[];if(!t.length)fresh++;else if(!t[t.length-1].ok)wrong++});return {n:ks.length,wrong,fresh}}
// 복습 순서: 마지막에 틀린 문제 → 아직 안 푼 문제 → 오래전에 푼 문제
function qPick(n,onlyWrong){
  const ks=Object.keys(S.quiz||{}).filter(k=>{const t=S.quiz[k].tries||[];return !onlyWrong||(t.length&&!t[t.length-1].ok)});
  const score=k=>{const t=S.quiz[k].tries||[],last=t[t.length-1];if(last&&!last.ok)return 0;if(!t.length)return 1;return 2+(last.d<daysAgo(3)?0:1)};
  return shuffle(ks).sort((a,b)=>score(a)-score(b)||String((S.quiz[a].tries||[]).slice(-1)[0]?.d||'').localeCompare(String((S.quiz[b].tries||[]).slice(-1)[0]?.d||''))).slice(0,n).map(qFromBank);
}
function lReview(n,onlyWrong){
  const qs=qPick(n,onlyWrong);
  if(!qs.length){toast(onlyWrong?'틀렸던 문제가 없어요 🎉':'저장된 문제가 아직 없어요. 새 문제를 먼저 풀어 보세요',3000);return}
  L={qs,i:0,res:[],picked:null,review:true,onlyWrong};lDraw();setTimeout(()=>lPlay(false),300);
}
async function lMake(n){
  const src=lSource(Math.max(n,8));
  if(src.length<3)throw new Error('저장한 표현이 3개 이상 있어야 해요');
  if(syncOn()){
    try{
      const c=new AbortController(),tm=setTimeout(()=>c.abort(),120000);
      const r=await fetch(QUIZ_URL,{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json','X-Sync-Token':SYNC.token},body:JSON.stringify({items:src.map(x=>({fr:x.fr,ko:x.ko})),n})});
      clearTimeout(tm);
      const j=r.ok?await r.json():null;
      const qs=(j&&j.questions||[]).filter(q=>q.lines&&q.lines.length&&q.answer&&(q.distractors||[]).length>=2).map(q=>({
        t:LTYPES[q.kind]?q.kind:'detail',scene:q.scene,qtext:q.question,say:q.lines.map(l=>l.fr),who:q.lines.map(l=>l.who),fr:q.lines.map(l=>l.fr),ko:q.lines.map(l=>l.ko),
        ans:q.answer,ansKo:q.answer_ko,opts:shuffle([q.answer,...q.distractors.filter(d=>d!==q.answer).slice(0,4)]),explain:q.explain,id:(src[q.target]||{}).id,ai:true}));
      if(qs.length>=Math.min(3,n)){
        const out=qs.slice(0,n),base=Date.now().toString(36);
        out.forEach((q,i)=>{q.qid=base+i;S.quiz[q.qid]=qBankRec(q)});save();
        return out;
      }
    }catch(_){}
    toast('상황 문제를 못 만들어서 기본 문제로 낼게요',2600);
  }
  return lLocal(src,n);
}

const MINI_URL=TR_URL.replace(/\/translate$/,'/mini');
var MX=null,MXN=5;
function mxStat(){const ks=Object.keys(S.mini||{});let wrong=0;ks.forEach(k=>{const t=S.mini[k].tries||[];if(t.length&&!t[t.length-1].ok)wrong++});return {n:ks.length,wrong}}

function mxItems(k){

}
async function mxNew(){

  $('#view').innerHTML=`<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:40px">🎧</div><h2>내 표현으로 짧은 듣기를 만드는 중…</h2><div class="muted">${MXN}세트 · 20~40초</div></div>`;
  try{
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),120000);
    const r=await fetch(MINI_URL,{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json','X-Sync-Token':SYNC.token},body:JSON.stringify({items:items.map(x=>({fr:x.fr,ko:x.ko})),n:MXN})});
    clearTimeout(tm);
    const j=await r.json().catch(()=>null);
    const sets=(j&&j.sets||[]).filter(s=>s.lines&&s.lines.length&&s.questions&&s.questions.length);
    if(!r.ok||!sets.length)throw new Error((j&&j.error)||('서버 '+r.status));
    if(MX!==my)return;
    const base=Date.now().toString(36),keys=[];
    sets.forEach((s,i)=>{const k=base+i;keys.push(k);
      S.mini[k]={at:today(),scene:s.scene,lines:s.lines,questions:s.questions.map(q=>({...q,id:q.target>=0&&items[q.target]?items[q.target].id:''})),tries:[]}});
    save();mxStart(keys);
  }catch(e){if(MX===my){MX=null;toast('듣기를 만들지 못했어요: '+(e.name==='AbortError'?'시간이 너무 걸렸어요':e.message),4000);render()}}
}
function mxReview(onlyWrong){
  const ks=Object.keys(S.mini||{}).filter(k=>{const t=S.mini[k].tries||[];return !onlyWrong||(t.length&&!t[t.length-1].ok)});
  if(!ks.length){toast(onlyWrong?'틀린 세트가 없어요 🎉':'저장된 세트가 없어요');return}
  const sc=k=>{const t=S.mini[k].tries||[],l=t[t.length-1];return l&&!l.ok?0:!t.length?1:2};
  mxStart(shuffle(ks).sort((a,b)=>sc(a)-sc(b)||String((S.mini[a].tries||[]).slice(-1)[0]?.d||'').localeCompare(String((S.mini[b].tries||[]).slice(-1)[0]?.d||''))).slice(0,MXN),true);
}
function mxStart(keys,review){MX={keys,i:0,ans:{},review,score:0,total:0,run:0};tab='test';render();scrollTo(0,0);setTimeout(()=>mxPlay(false),300)}
async function mxPlay(slow){
  if(!MX||MX.loading)return;const s=S.mini[MX.keys[MX.i]];
  if(MX.playing){MX.run++;ttsStop();MX.playing=false;mxDrawPlay();return}
  const run=++MX.run;MX.playing=true;mxDrawPlay();
  for(const l of s.lines){if(!MX||MX.run!==run)return;await speakP(l.fr,slow,l.who==='나'?0:1);await sleep(350)}
  if(MX&&MX.run===run){MX.playing=false;mxDrawPlay()}
}
function mxDrawPlay(){const b=$('#mxplay');if(b)b.textContent=MX.playing?'⏹ 멈추기':'▶ 대화 듣기'}
function mxDraw(){
  if(!MX||MX.loading)return;
  if(MX.i>=MX.keys.length)return mxEnd();
  const k=MX.keys[MX.i],s=S.mini[k],qs=s.questions,done=qs.every((q,qi)=>MX.ans[k+'.'+qi]!==undefined);
  $('#view').innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between"><span class="qtype">${MX.review?'🔁 ':''}🎧 짧은 듣기</span><span class="muted">${MX.i+1} / ${MX.keys.length}</span></div>
    <div class="bar"><i style="width:${MX.i/MX.keys.length*100}%"></i></div>
    <div class="muted" style="margin-top:6px">🎭 ${esc(s.scene||'')}</div>
    <div class="play"><button class="btn" id="mxplay">${MX.playing?'⏹ 멈추기':'▶ 대화 듣기'}</button><button class="btn" id="mxslow">🐢 천천히</button></div>
    ${qs.map((q,qi)=>{const a=MX.ans[k+'.'+qi],ans=a!==undefined;return `<div class="dq"><b>${qi+1}. ${esc(q.q_ko)}</b>
      <div class="lopts">${q.options_ko.map((o,oi)=>`<button class="lopt ${ans?(oi===q.answer?'good':oi===a?'bad':''):''}" data-mq="${qi}" data-mo="${oi}" ${ans?'disabled':''}><b>${'①②③'[oi]}</b> ${esc(o)}</button>`).join('')}</div>
      ${ans?`<div style="font-size:14px;margin-top:6px">${a===q.answer?'⭕ 정답!':'❌ 아쉬워요'} · 💡 ${esc(q.explain_ko)}</div>`:''}</div>`}).join('')}
    ${done?`<div class="script" style="margin-top:12px"><div class="muted" style="margin-bottom:4px">📜 대화 전문</div>${s.lines.map(l=>`<div class="sl"><button class="ib" data-say="${esc(l.fr)}">🔊</button><div><div class="fr"><b>${esc(l.who)}:</b> ${esc(l.fr)}</div><div class="muted">${esc(l.ko)}</div></div></div>`).join('')}</div>
      <button class="btn pri big" id="mxnext" style="margin-top:12px">${MX.i+1<MX.keys.length?'다음 세트 →':'결과 보기'}</button>`
      :'<div class="muted" style="margin-top:10px;font-size:13px">💡 몇 번이든 다시 들어도 돼요. 고르면 바로 정답이 나와요.</div>'}
    <button class="btn sm" id="mxquit" style="margin-top:10px">그만하기</button>
  </div>`;
  $('#mxplay').onclick=()=>mxPlay(false);$('#mxslow').onclick=()=>{if(MX.playing){MX.run++;ttsStop();MX.playing=false}mxPlay(true)};
  document.querySelectorAll('[data-mq]').forEach(b=>b.onclick=()=>{
    const qi=+b.dataset.mq,oi=+b.dataset.mo,q=qs[qi],ok=oi===q.answer;
    MX.ans[k+'.'+qi]=oi;MX.total++;if(ok)MX.score++;
    const it=q.id&&S.items.find(x=>x.id===q.id);if(it){const at=it.att||(it.att=[]);at.push({d:today(),t:'mini',ok});if(at.length>60)at.splice(0,at.length-60)}
    if(qs.every((_,j)=>MX.ans[k+'.'+j]!==undefined)){const allOk=qs.every((q2,j)=>MX.ans[k+'.'+j]===q2.answer);const tr=s.tries||(s.tries=[]);tr.push({d:today(),ok:allOk});if(tr.length>30)tr.splice(0,tr.length-30)}
    save();const y=scrollY;mxDraw();scrollTo(0,y);
  });
  const nx=$('#mxnext');if(nx)nx.onclick=()=>{MX.run++;ttsStop();MX.playing=false;MX.i++;mxDraw();scrollTo(0,0);if(MX&&MX.i<MX.keys.length)setTimeout(()=>mxPlay(false),250)};
  $('#mxquit').onclick=()=>{MX.run++;ttsStop();MX=null;render()};
}
function mxEnd(){
  const {score,total,review}=MX;
  S.history.push({d:today(),at:timeNow(),s:'mini',score,total,wrong:[]});save();
  MX=null;
  $('#view').innerHTML=`<div class="card" style="text-align:center"><h2>🎧 짧은 듣기 결과</h2>
    <div style="font-size:44px;font-weight:800;color:var(--accent)">${score} / ${total}</div>
    <div class="muted">${total&&score===total?'🎉 완벽해요! Bravo !':score/total>=.7?'👍 잘했어요!':'💪 괜찮아요. 틀린 세트만 다시 들어 봐요.'}</div>
    <div class="muted" style="font-size:13px;margin-top:6px">🗂️ 저장된 세트 ${mxStat().n}개</div>
    <button class="btn pri big" id="mxagain" style="margin-top:14px">${review?'🔁 한 번 더 복습':'🆕 새 세트로 한 번 더'}</button>
    <button class="btn" id="mxback" style="margin-top:8px;width:100%">테스트 화면으로</button></div>`;
  $('#mxagain').onclick=()=>review?mxReview(false):mxNew();
  $('#mxback').onclick=()=>{render();scrollTo(0,0)};
}

// ---------- 🎓 DELF 모의 듣기 (A1·A2와 같은 구성 · 매번 새 문제 · 쌓아서 다시 보기) ----------
// 공식 기출문제를 옮기지 않고, 같은 형식(연습 4개 · 25점 · 두 번 듣기 · 보기 A/B/C)으로 새로 만들어요.
const DELF_URL=TR_URL.replace(/\/translate$/,'/delf');
var DX=null;
const delfList=()=>Object.entries(S.delf||{}).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
function delfCard(){
  const all=delfList();

    <div class="muted" style="margin-bottom:10px">실제 DELF 듣기와 같은 구성이에요: <b>연습 4개 · 25점 · 녹음은 두 번</b> · 보기 A/B/C. 공식 기출을 옮긴 것이 아니라 같은 형식으로 새로 만든 문제예요. 만든 시험은 아래에 쌓여서 몇 번이든 다시 볼 수 있어요.</div>

      :'<div class="muted" style="font-size:13px;margin-top:8px">🗂️ 아직 만든 시험이 없어요. 새 시험을 만들면 여기에 쌓여요.</div>'}
  </div>`;
}
function bindDelf(){
  document.querySelectorAll('[data-dnew]').forEach(b=>b.onclick=()=>delfNew(b.dataset.dnew));
  document.querySelectorAll('[data-dgo]').forEach(b=>b.onclick=()=>delfStart(b.dataset.dgo));
}
async function delfNew(level,mine){
  if(!syncOn()){toast('DELF 시험은 ☁️ 동기화를 연결한 기기에서 만들 수 있어요',3500);return}
  const my={loading:true};DX=my;
  $('#view').innerHTML=`<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:40px">🎓</div><h2>${mine?'내 표현으로 DELF 형식 시험을 만드는 중…':`DELF ${level} 모의고사를 만드는 중…`}</h2><div class="muted">${mine?esc(mine.label)+' · ':''}연습 4개의 녹음 대본과 문제를 만들고 있어요 (1~2분)</div></div>`;
  try{
    const c=new AbortController(),tm=setTimeout(()=>c.abort(),180000);
    const r=await fetch(DELF_URL,{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json','X-Sync-Token':SYNC.token},body:JSON.stringify(mine?{level,items:mine.items.map(x=>({fr:x.fr,ko:x.ko}))}:{level})});
    clearTimeout(tm);
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!Array.isArray(j.exercises)||!j.exercises.length)throw new Error((j&&j.error)||('서버 '+r.status));
    if(DX!==my)return;
    const id='d'+Date.now().toString(36);
    S.delf[id]={at:today(),ts:Date.now(),level,exam:j,tries:[],...(mine?{label:mine.label,ids:mine.items.map(x=>x.id)}:{})};save();
    delfStart(id);
  }catch(e){if(DX===my){DX=null;toast('시험을 만들지 못했어요: '+(e.name==='AbortError'?'시간이 너무 걸렸어요':e.message),4000);render()}}
}
function delfStart(id){
  const r=S.delf[id];if(!r)return;
  const steps=[];r.exam.exercises.forEach((ex,ei)=>(ex.docs||[]).forEach((d,di)=>steps.push({ei,di})));
  DX={id,steps,i:0,ans:{},plays:{},practice:false,ko:false,done:false,run:0};tab='test';render();scrollTo(0,0);
}
const dxWho=w=>w==='B'?1:0;
async function dxPlay(){
  const r=S.delf[DX.id],st=DX.steps[DX.i],doc=r.exam.exercises[st.ei].docs[st.di],key=st.ei+'.'+st.di;
  if(DX.playing){DX.run++;ttsStop();DX.playing=false;dxDraw();return}
  if(!DX.practice&&(DX.plays[key]||0)>=2)return;
  const run=++DX.run;DX.playing=true;dxDraw();
  for(const l of doc.lines){if(!DX||DX.run!==run)return;await speakP(l.fr,false,dxWho(l.who));await sleep(380)}
  if(!DX||DX.run!==run)return;
  DX.plays[key]=(DX.plays[key]||0)+1;DX.playing=false;dxDraw();
}
function dxDraw(){
  if(!DX||DX.loading)return;
  if(DX.done)return dxResult();
  const r=S.delf[DX.id],st=DX.steps[DX.i],ex=r.exam.exercises[st.ei],doc=ex.docs[st.di],key=st.ei+'.'+st.di;
  const pl=DX.plays[key]||0,left=Math.max(0,2-pl),last=DX.i===DX.steps.length-1;
  const firstOfEx=st.di===0;
  $('#view').innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between"><span class="qtype">🎓 ${r.label?'내 표현':'DELF '+esc(r.level)} · ${esc(ex.title_ko)}</span><span class="muted">${DX.i+1} / ${DX.steps.length}</span></div>
    <div class="bar"><i style="width:${DX.i/DX.steps.length*100}%"></i></div>
    <div class="dcons">${esc(ex.consigne_fr)}</div><div class="muted" style="font-size:13px">${esc(ex.consigne_ko)}</div>
    <div style="margin-top:10px;font-weight:600">🎧 ${esc(doc.kind||'녹음')}${ex.docs.length>1?` · ${st.di+1}/${ex.docs.length}`:''}</div>
    <div class="play"><button class="btn ${DX.playing?'on':''}" id="dxplay" ${!DX.practice&&left===0&&!DX.playing?'disabled':''}>${DX.playing?'⏹ 멈추기':`▶ 녹음 듣기 ${DX.practice?'(연습 모드)':`(남은 횟수 ${left}/2)`}`}</button></div>
    ${firstOfEx&&pl===0&&!DX.playing?'<div class="muted" style="font-size:13px">💡 실제 시험처럼 먼저 문제를 읽고 녹음을 들으세요.</div>':''}
    <div class="row" style="gap:14px;margin-top:6px;font-size:13px"><label><input type="checkbox" id="dxprac" ${DX.practice?'checked':''}> 연습 모드 (몇 번이든 듣기)</label><label><input type="checkbox" id="dxko" ${DX.ko?'checked':''}> 🇰🇷 한국어 보기</label></div>
    ${doc.questions.map((q,qi)=>{const k=key+'.'+qi,a=DX.ans[k];return `<div class="dq"><b>${qi+1}. ${esc(q.q_fr)}</b> <small class="muted">(${q.points}점)</small>${DX.ko?`<div class="muted" style="font-size:13px">${esc(q.q_ko)}</div>`:''}
      <div class="lopts">${q.options_fr.map((o,oi)=>`<button class="lopt ${a===oi?'sel':''}" data-dk="${k}" data-do="${oi}"><b>${'ABC'[oi]}</b> ${esc(o)}${DX.ko&&q.options_ko[oi]?`<div class="muted" style="font-size:12px">${esc(q.options_ko[oi])}</div>`:''}</button>`).join('')}</div></div>`}).join('')}
    <div class="row" style="margin-top:14px">${DX.i?'<button class="btn" id="dxprev">← 이전</button>':''}<button class="btn pri" id="dxnext" style="flex:1">${last?'✅ 제출하고 채점하기':'다음 →'}</button></div>
    <button class="btn sm" id="dxquit" style="margin-top:10px">시험 그만두기</button>
  </div>`;
  $('#dxplay').onclick=dxPlay;
  $('#dxprac').onchange=e=>{DX.practice=e.target.checked;dxDraw()};
  $('#dxko').onchange=e=>{DX.ko=e.target.checked;dxDraw()};
  document.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{DX.ans[b.dataset.dk]=+b.dataset.do;document.querySelectorAll(`[data-dk="${b.dataset.dk}"]`).forEach(x=>x.classList.toggle('sel',x===b))});
  const pv=$('#dxprev');if(pv)pv.onclick=()=>{DX.run++;ttsStop();DX.playing=false;DX.i--;dxDraw();scrollTo(0,0)};
  $('#dxnext').onclick=()=>{
    const miss=doc.questions.some((q,qi)=>DX.ans[key+'.'+qi]===undefined);
    if(miss&&!confirm('답하지 않은 문제가 있어요. 넘어갈까요?'))return;
    DX.run++;ttsStop();DX.playing=false;
    if(last)return dxSubmit();
    DX.i++;dxDraw();scrollTo(0,0);
  };
  $('#dxquit').onclick=()=>{if(!confirm('시험을 그만둘까요? (만든 시험은 보관함에 남아요)'))return;DX.run++;ttsStop();DX=null;render()};
}
function dxSubmit(){
  const r=S.delf[DX.id];let got=0,tot=0;const per=[];
  const seen={};
  r.exam.exercises.forEach((ex,ei)=>{let g=0,t=0;(ex.docs||[]).forEach((d,di)=>d.questions.forEach((q,qi)=>{const p=+q.points||1,ok=DX.ans[ei+'.'+di+'.'+qi]===q.answer;t+=p;if(ok)g+=p;
    const iid=r.ids&&q.target>=0&&r.ids[q.target];if(iid&&!seen[iid]){seen[iid]=1;const it=S.items.find(x=>x.id===iid);if(it){const at=it.att||(it.att=[]);at.push({d:today(),t:'delf',ok});if(at.length>60)at.splice(0,at.length-60)}}}));per.push({name:ex.title_ko,g,t});got+=g;tot+=t});
  const sc=Math.round((tot?got/tot*25:0)*2)/2;

}

    <div class="muted" style="font-size:12px;margin-top:4px">DELF 합격: 4개 영역 합계 50/100 이상 · 영역마다 최소 5/25</div>
    <div style="text-align:left;margin-top:12px">${per.map(p=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span>${esc(p.name)}</span><b>${p.g} / ${p.t}</b></div>`).join('')}</div></div>

    <div class="script"><div class="muted" style="margin-bottom:4px">📜 ${esc(d.kind||'녹음')} 대본</div>${d.lines.map(l=>`<div class="sl"><button class="ib" data-say="${esc(l.fr)}">🔊</button><div><div class="fr">${l.who!=='N'?`<b>${esc(l.who)}:</b> `:''}${esc(l.fr)}</div><div class="muted">${esc(l.ko)}</div></div></div>`).join('')}</div>
    ${d.questions.map((q,qi)=>{const a=DX.ans[ei+'.'+di+'.'+qi];return `<div class="dq"><b>${esc(q.q_fr)}</b><div class="muted" style="font-size:13px">${esc(q.q_ko)}</div>
      <div class="lopts">${q.options_fr.map((o,oi)=>`<div class="lopt ${oi===q.answer?'good':oi===a?'bad':''}"><b>${'ABC'[oi]}</b> ${esc(o)} <span class="muted" style="font-size:12px">${esc(q.options_ko[oi]||'')}</span>${oi===q.answer?' ✅':oi===a?' ❌ 내 답':''}</div>`).join('')}</div>
      <div style="font-size:13px;margin-top:6px">💡 ${esc(q.explain_ko)}${a===undefined?' <b style="color:var(--bad)">(답 안 함)</b>':''}</div></div>`}).join('')}`).join('')}</div>`).join('')}
  <div class="row"><button class="btn pri" id="dxagain" style="flex:1">🔁 이 시험 다시 보기</button><button class="btn" id="dxback" style="flex:1">테스트 화면으로</button></div>`;
  $('#dxagain').onclick=()=>delfStart(DX.id);
