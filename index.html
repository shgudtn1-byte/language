// ---------- ☁️ 기기 간 동기화 (GitHub 비공개 저장소의 data.json) ----------
// 기록을 작은 조각(표현 1개, 하루 할 일, 하루 일기…)으로 나눠 조각마다 마지막 수정 시각을 기억하고,
// 두 기기의 기록을 합칠 때 조각별로 더 최근 것을 골라요. 그래서 다른 기기에서 쓴 내용이 서로 덮어써지지 않아요.
var snap=null,syncTimer=null,syncing=false,syncAgain=false,syncState='off',renderLater=false;
const SK='frstudy.sync';
var SYNC=(()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(_){return {}}})();
function saveSync(){try{localStorage.setItem(SK,JSON.stringify(SYNC))}catch(_){}}
const syncOn=()=>!!(SYNC.repo&&SYNC.token);

function parts(s){
  const p={};
  (s.items||[]).forEach(x=>p['item:'+x.id]=JSON.stringify(x));
  for(const d in s.todos||{})p['todos:'+d]=JSON.stringify(s.todos[d]);
  for(const d in s.diary||{})p['diary:'+d]=JSON.stringify(s.diary[d]);
  for(const d in s.log||{})p['log:'+d]=JSON.stringify(s.log[d]);
  for(const d in s.speak||{})p['speak:'+d]=JSON.stringify(s.speak[d]);
  for(const k in s.quiz||{})p['quiz:'+k]=JSON.stringify(s.quiz[k]);
  for(const k in s.delf||{})p['delf:'+k]=JSON.stringify(s.delf[k]);
  for(const k in s.mini||{})p['mini:'+k]=JSON.stringify(s.mini[k]);
  p.wrong=JSON.stringify(s.wrong||{});p.settings=JSON.stringify(s.settings||{});
  return p;
}
function stampChanges(){
  const now=Date.now(),cur=parts(S);S.stamp=S.stamp||{};
  if(snap){for(const k in cur)if(cur[k]!==snap[k])S.stamp[k]=now;for(const k in snap)if(!(k in cur))S.stamp[k]=now}
  snap=cur;
}
function onSaved(){
  stampChanges();
  if(!syncOn())return;
  const drilling=typeof SP!=='undefined'&&SP&&SP.running;
  if(drilling&&syncTimer)return; // 스피킹 중에는 1분에 한 번만 올려요
  clearTimeout(syncTimer);setSync('wait');
  syncTimer=setTimeout(()=>{syncTimer=null;syncNow()},drilling?60000:4000);
}
function rebuild(p,base){
  const s={...base,items:[],todos:{},diary:{},log:{},speak:{},wrong:{},settings:{},quiz:{},delf:{},mini:{}};
  for(const k in p){
    const v=JSON.parse(p[k]);
    if(k==='wrong'){s.wrong=v;continue}if(k==='settings'){s.settings=v;continue}
    const i=k.indexOf(':'),t=k.slice(0,i),id=k.slice(i+1);
    if(t==='item')s.items.push(v);else if(t==='todos')s.todos[id]=v;else if(t==='diary')s.diary[id]=v;else if(t==='log')s.log[id]=v;else if(t==='speak')s.speak[id]=v;else if(t==='quiz')s.quiz[id]=v;else if(t==='delf')s.delf[id]=v;else if(t==='mini')s.mini[id]=v;
  }
  s.items.sort((a,b)=>a.added<b.added?-1:a.added>b.added?1:0);
  return s;
}
function merge(L,R){
  const pl=parts(L),pr=parts(R),sl=L.stamp||{},sr=R.stamp||{},out={},st={};
  const keys=new Set([...Object.keys(pl),...Object.keys(pr),...Object.keys(sl),...Object.keys(sr)]);
  for(const k of keys){
    const a=sl[k]||0,b=sr[k]||0,src=(b>a||(b===a&&!(k in pl)))?pr:pl;
    if(k in src)out[k]=src[k];
    st[k]=Math.max(a,b);
  }
  const s=rebuild(out,L);s.stamp=st;
  const seen=new Set();
  s.history=[...(L.history||[]),...(R.history||[])].filter(h=>{const id=JSON.stringify(h);if(seen.has(id))return false;seen.add(id);return true})
    .sort((a,b)=>(a.d+a.at)<(b.d+b.at)?-1:(a.d+a.at)>(b.d+b.at)?1:0);
  return s;
}
const sig=s=>{const p=parts(s);return Object.keys(p).sort().map(k=>k+'='+p[k]).join('\n')+'#'+(s.history||[]).length};
// 이 기기에 아직 내 기록이 없으면(예시 문장뿐) 클라우드 기록을 그대로 받아요
const isFresh=s=>s.items.every(x=>x.sample)&&!Object.keys(s.diary).length&&!Object.keys(s.todos).length&&!s.history.length&&!Object.keys(s.speak||{}).length;

const enc=str=>{const b=new TextEncoder().encode(str);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)};
const dec=b64=>new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function api(method,body,raw){
  return fetch(`https://api.github.com/repos/${SYNC.repo}/contents/${DATAFILE}`,{method,cache:'no-store',
    headers:{Authorization:'Bearer '+SYNC.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
async function pull(){
  const r=await api('GET');
  if(r.status===404)return {data:null,sha:null};
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();
  let text=j.content?dec(j.content):'';
  if(!text){const r2=await api('GET',null,true);if(!r2.ok)throw new Error(String(r2.status));text=await r2.text()}
  return {data:JSON.parse(text),sha:j.sha};
}
async function push(sha){
  const body={message:ME.n+' 기록 동기화 '+today()+' '+timeNow(),content:enc(JSON.stringify(S))};if(sha)body.sha=sha;
  const r=await api('PUT',body);
  if(r.status===409||r.status===422)return false; // 다른 기기가 방금 저장함 → 다시 받아서 합치기
  if(!r.ok)throw new Error(String(r.status));
  return true;
}
const syncMsg=e=>e.message==='401'?'토큰이 틀렸거나 만료됐어요':e.message==='403'?'토큰에 쓰기 권한이 없어요 (Contents: Read and write)':e.message==='404'?'기록 저장소를 찾을 수 없어요':'인터넷 연결을 확인하세요';
// 안경이나 Claude에서 물어 노션에 들어온 새 표현을 내 목록에 넣어요 (노형수 기록만)
const INBOX_URL=TR_URL.replace(/\/translate$/,'/inbox');
const normFr=t=>String(t||'').normalize('NFC').toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim();
async function fetchInbox(){
  if(PROF!=='noh')return [];
  try{const r=await fetch(INBOX_URL,{cache:'no-store',headers:{'X-Sync-Token':SYNC.token}});
    if(!r.ok)return [];const j=await r.json();return Array.isArray(j.items)?j.items:[]}catch(_){return []}
}
function applyInbox(list){
  const have=new Set(S.items.map(x=>normFr(x.fr)));let n=0;const now=Date.now();S.stamp=S.stamp||{};
  for(const x of list){
    const k=normFr(x.fr),fr=String(x.fr||'').trim(),ko=String(x.ko||'').trim();
    if(!k||!ko||have.has(k))continue;have.add(k);
    const id='n'+String(x.id).replace(/-/g,'');
    const it={id,fr,ko,kind:kindOf(fr),added:x.added||today(),right:0,wrong:0};if(x.pron)it.pron=x.pron;
    S.items.push(it);S.stamp['item:'+id]=now;n++;
  }
  return n;
}
function ackInbox(list){
  return fetch(INBOX_URL+'/ack',{method:'POST',headers:{'X-Sync-Token':SYNC.token,'Content-Type':'application/json'},
    body:JSON.stringify({ids:list.map(x=>x.id)})}).catch(()=>{});
}
async function syncNow(manual){
  if(!syncOn())return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('busy');
  try{
    let done=false,added=0;
    const inbox=await fetchInbox();
    for(let i=0;i<4&&!done;i++){
      const {data,sha}=await pull();
      const before=sig(S);
      let next=S;
      if(data){if(!data.stamp)data.stamp={};next=(!SYNC[JK]&&isFresh(S))?data:merge(S,data)}
      S=next;added=applyInbox(inbox)||added;fix();snap=parts(S);
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
      if(!SYNC[JK]){SYNC[JK]=true;saveSync()}
      done=(data&&sig(data)===sig(S))?true:await push(sha);
      if(sig(S)!==before)softRender();
    }
    setSync(done?'ok':'err');
    if(done&&inbox.length){await ackInbox(inbox);if(added)toast('새 표현 '+added+'개가 들어왔어요 ✓')}
    if(manual)toast(done?'동기화했어요 ☁️':'동기화 충돌 — 잠시 뒤 다시 해보세요');
  }catch(e){setSync('err');SYNC.lastErr=syncMsg(e);if(manual)toast('동기화 실패: '+syncMsg(e))}
  syncing=false;
  if(syncAgain){syncAgain=false;syncNow()}
}
// 입력 중이거나 테스트 중이면 화면을 바로 바꾸지 않아요

function profPicker(first){
  const d=document.createElement('div');d.className='ovl';
  d.innerHTML=`<div class="card" style="max-width:360px;margin:18vh auto 0"><h2>누가 공부하나요? 👤</h2>
    <div class="muted">사람마다 저장한 단어·문장, 시험 기록, 오답노트, 스피킹 기록이 <b>따로</b> 보관돼요.</div>
    <div class="row" style="margin-top:12px">${PROFS.map(p=>`<button class="btn big ${!first&&p.c===PROF?'pri':''}" data-pf="${p.c}" style="flex:1">${p.e} ${p.n}</button>`).join('')}</div>
    ${first?'':'<button class="btn sm" id="pfx" style="margin-top:10px;width:100%">닫기</button>'}</div>`;
  document.body.appendChild(d);
  const x=d.querySelector('#pfx');if(x)x.onclick=()=>d.remove();
  d.querySelectorAll('[data-pf]').forEach(b=>b.onclick=async()=>{
    const c=b.dataset.pf;
    if(first){try{localStorage.setItem(PK,c)}catch(_){}if(c===PROF){d.remove();return}location.reload();return}
    if(c===PROF){d.remove();return}
    if(((T&&!T.done)||(typeof SP!=='undefined'&&SP)||(typeof L!=='undefined'&&L))&&!confirm('하던 것을 멈추고 바꿀까요?'))return;
    b.disabled=true;b.textContent='바꾸는 중…';
    if(syncOn()){clearTimeout(syncTimer);syncTimer=null;try{await syncNow()}catch(_){}} // 지금 사람 기록을 먼저 올려요
    try{localStorage.setItem(PK,c)}catch(_){}
    location.reload();
  });
}
$('#prof').onclick=()=>profPicker(false);
profBtn();
if(profFirst)setTimeout(()=>profPicker(true),300);

if(location.hash==='#admin')tab='admin';
snap=parts(S);
setSync(syncOn()?'busy':'off');
// 카카오톡·인스타 같은 앱 안에서 열면 소리(음성)가 안 나와요 → Chrome으로 열도록 안내
(function(){
  const ua=navigator.userAgent,android=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua);
  const kakao=/KAKAOTALK/i.test(ua),inapp=kakao||/Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER\(|Whale\/.*inapp|; wv\)|DaumApps|everytimeApp|Snapchat|TikTok|musical_ly/i.test(ua);
  if(!inapp&&hasTTS)return;
  const url=location.href.split('#')[0];
  const box=$('#inapp');box.style.display='block';
  box.innerHTML=`<b>🔇 지금 화면에서는 불어 소리가 안 나와요</b>
    <div class="muted" style="margin:6px 0 10px">${inapp?'카카오톡·인스타그램 같은 앱 안에서 열면 음성이 막혀 있어요.':'이 브라우저는 음성 재생을 지원하지 않아요.'} ${ios?'<b>Safari</b>':'<b>Chrome</b>'}으로 열어 주세요.</div>
    <div class="row"><button class="btn pri sm" id="openext">${ios?'Safari':'Chrome'}으로 열기</button><button class="btn sm" id="copyurl">주소 복사</button></div>
    <div class="muted" style="font-size:13px;margin-top:8px">버튼이 안 되면: 오른쪽 위(또는 아래) <b>⋮ / ···</b> 메뉴 → <b>"다른 브라우저로 열기"</b>를 누르세요.</div>`;
  $('#openext').onclick=()=>{
    if(kakao)location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);
    else if(android)location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
    else toast('⋯ 메뉴에서 "Safari로 열기"를 눌러 주세요',4000);
  };
  $('#copyurl').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('주소를 복사했어요. Chrome 주소창에 붙여 넣으세요',4000)}catch(e){prompt('이 주소를 복사하세요',url)}};
})();
render();
if(syncOn())syncNow();
</script>
