<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>매일 불어 테스트</title>
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1f1d1a;--muted:#6b665e;--line:#e4ded3;--accent:#e2701b;--accent-ink:#fff;--soft:#fbeee2;--good:#16815a;--good-soft:#e3f4ec;--bad:#c8372d;--bad-soft:#fbe6e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#22201d;--ink:#f1ede6;--muted:#a49d92;--line:#38342f;--accent:#f08a3c;--accent-ink:#1a120b;--soft:#3a2a1d;--good:#4cc28c;--good-soft:#16302a;--bad:#ef6a5f;--bad-soft:#3a1d1a}}
:root[data-theme="dark"]{--bg:#171614;--card:#22201d;--ink:#f1ede6;--muted:#a49d92;--line:#38342f;--accent:#f08a3c;--accent-ink:#1a120b;--soft:#3a2a1d;--good:#4cc28c;--good-soft:#16302a;--bad:#ef6a5f;--bad-soft:#3a1d1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.flag{display:flex;height:22px;width:33px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1}.flag i:nth-child(1){background:#f77f00}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#009e60}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav button{flex:1;max-width:128px;background:none;border:0;padding:8px 2px 12px;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:2px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.big{width:100%;padding:14px;font-size:17px}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.accents{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.accents button{font:inherit;min-width:34px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer}
.check{display:grid;gap:8px}
.check div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.check .done{background:var(--good-soft)}
.check span.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.check .done span.dot{background:var(--good);border-color:var(--good);color:#fff}
.stat{display:flex;gap:8px}
.stat div{flex:1;background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .fr{font-weight:600;word-break:break-word}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--soft);color:var(--accent);margin-left:4px;font-weight:500;white-space:nowrap}
.ib{border:0;background:none;cursor:pointer;font-size:18px;padding:4px;color:var(--ink)}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opts small{display:block;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;padding:9px;border:0;background:var(--card);color:var(--ink);cursor:pointer}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 30%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer}
.chip small{color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.chip.on small{color:inherit;opacity:.8}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtype{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:6px}
.prompt{font-size:24px;font-weight:600;margin:6px 0 14px;word-break:break-word}
.play{display:flex;gap:8px;margin:8px 0 14px}
.play button{flex:1}
.lopts{display:grid;gap:8px}.lopts.pics{grid-template-columns:repeat(5,1fr)}
.lopt{font:inherit;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;line-height:1.4}
.lopt b{color:var(--accent);margin-right:4px}.lopt:hover:not(:disabled){border-color:var(--accent)}
.lopt.pic5{text-align:center;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}.lopt.pic5 span{font-size:30px;line-height:1.2}
.lopt.good{background:var(--good-soft);border-color:var(--good)}.lopt.bad{background:var(--bad-soft);border-color:var(--bad)}.lopt:disabled{cursor:default}
#lplay.on{border-color:var(--accent);color:var(--accent)}
.script{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}.sl{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.fb{border-radius:12px;padding:14px;margin-top:12px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb h3{margin:0 0 6px;font-size:17px}
.fb.ok h3{color:var(--good)}.fb.no h3{color:var(--bad)}
.miss{background:var(--bad);color:#fff;border-radius:4px;padding:0 3px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.score{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.pic{flex:none;display:grid;place-items:center;border-radius:12px;background:var(--soft);overflow:hidden;border:0;padding:0;color:inherit;font:inherit;line-height:1}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.s{width:46px;height:46px;font-size:20px;cursor:pointer;letter-spacing:-2px}
.pic.s.none{opacity:.45;font-size:16px}
.pic.l{width:100%;height:190px;font-size:76px;margin-bottom:12px;letter-spacing:6px}
.pic.m{width:100%;height:130px;font-size:54px;margin:8px 0;letter-spacing:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .card{width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent;background:var(--bg)}
.grid img:hover{border-color:var(--accent)}
.adm{margin-left:8px;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:5px 10px;border-radius:16px;white-space:nowrap;background:var(--card)}
.adm:hover{border-color:var(--accent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tiles div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.tiles b{display:block;font-size:22px}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:4px 8px;margin-top:4px;line-height:1.45}
.seg.wrap2{flex-wrap:wrap}.seg.wrap2 button{flex:1 1 45%;font-size:14px}
.gram{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:14px;line-height:1.6}.gram summary{cursor:pointer;font-weight:700;color:var(--accent)}.gram ol{padding-left:18px;margin:8px 0}.gram li{margin-bottom:8px}
.pron{font-size:13px;color:var(--accent);margin:1px 0}.pron.big{font-size:17px;margin:0 0 6px}
.big-fr{font-size:28px;font-weight:700;line-height:1.35;margin:8px 0 4px;word-break:break-word}
.dots{display:flex;gap:7px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.dots i.cur{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.phase{text-align:center;font-size:20px;font-weight:700;padding:12px;border-radius:12px;margin:10px 0 6px}
.phase.listen{background:var(--soft);color:var(--accent)}
.phase.speak{background:var(--good-soft);color:var(--good)}
.phase.again{background:var(--bad-soft);color:var(--bad)}
.cd{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.cd i{display:block;height:100%;background:var(--good);width:0}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ctrl button{padding:12px 2px;font-size:14px}
.clamp{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="flag"><i></i><i></i><i></i></div><div><h1>매일 불어 테스트</h1><div class="muted" id="sub"></div></div><span id="sync" style="margin-left:auto;font-size:18px;cursor:pointer"></span><a href="#admin" class="adm" id="adm">🔒 관리자</a></header>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
// ---------- 저장소 ----------
const KEY='frstudy.v1';
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
const uid=()=>Math.random().toString(36).slice(2,10);

function seed(){
  const y=daysAgo(1), t=today();
  const mk=(fr,ko,added,e)=>({id:uid(),fr,ko,kind:fr.trim().includes(' ')?'문장':'단어',added,right:0,wrong:0,sample:true,img:{t:'emoji',v:e}});
  return {
    items:[
      mk('Bonne arrivée !','잘 오셨어요! (도착 환영 인사)',y,'🤗🧳🏠'),
      mk('On se voit au maquis ce soir ?','오늘 저녁 마키(식당)에서 볼까?',y,'🌙🍽️🐟'),
      mk('Combien ça coûte ?','이거 얼마예요?',y,'🏷️💰❓'),
      mk('le marché','시장',y,'🧺🍌🍅'),
      mk('Je voudrais aller à Cocody, s\'il vous plaît.','코코디에 가고 싶어요.',t,'🚕➡️📍'),
      mk('Il fait très chaud aujourd\'hui.','오늘 정말 덥다.',t,'☀️🥵🌡️'),
      mk('la monnaie','잔돈',t,'🪙🪙💵'),
    ],
    wrong:{}, log:{},
    settings:{strict:false,rate:0.9,voice:'',types:{spell:true,dict:true,both:true,speak:true}}
  };
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return d}catch(e){}return seed()}
function save(){if(typeof onSaved==='function')onSaved();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function fix(){S.todos=S.todos||{};S.diary=S.diary||{};S.history=S.history||[];S.settings=S.settings||{};S.wrong=S.wrong||{};S.log=S.log||{};S.stamp=S.stamp||{};S.speak=S.speak||{};
  S.settings.sp=Object.assign({goalMin:60,goalReps:300,reps:5,pause:'mid',mode:(window.SpeechRecognition||window.webkitSpeechRecognition)?'mic':'auto',show:'text',scope:'least',slowFirst:true,pk:'s',cat:'👋 인사'},S.settings.sp||{})}
fix();

// ---------- 유틸 ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms||1600)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const isMorning=()=>new Date().getHours()<14;
const byId=id=>S.items.find(x=>x.id===id)||(typeof PITEMS!=='undefined'?PITEMS[id]:undefined);

function norm(s,strict){
  s=(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/œ/g,'oe').replace(/æ/g,'ae');
  if(!strict)s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  return s.replace(/[.,!?;:«»"()\-–—…¿¡]/g,' ').replace(/\s+/g,' ').trim();
}
const normKo=s=>(s||'').replace(/\([^)]*\)/g,'').replace(/[\s.,!?~·'"]/g,'').trim();

function gradeFr(ans,correct){
  if(norm(ans,true)===norm(correct,true))return {ok:true};
  if(norm(ans,false)===norm(correct,false)){
    return S.settings.strict?{ok:false,note:'악센트(é, è, ç…)가 달라요.'}:{ok:true,note:'악센트가 조금 달라요 — 정답의 악센트를 확인하세요.'};
  }
  return {ok:false};
}
function gradeKo(ans,correct){
  const a=normKo(ans),c=normKo(correct),full=(correct||'').replace(/[\s.,!?~]/g,'');
  if(!a)return false;
  return a===c||a===full||(a.length>=2&&(c.includes(a)||a.includes(c)));
}
// 정답 문장에서 내가 놓친 단어 강조
function diffHtml(ans,correct){
  const mine=new Set(norm(ans,!0).split(' '));
  const mineLoose=new Set(norm(ans,!1).split(' '));
  return correct.split(/(\s+)/).map(w=>{
    if(/^\s+$/.test(w)||!w)return w;
    const k=norm(w,true);if(!k)return esc(w);
    if(mine.has(k))return esc(w);
    if(mineLoose.has(norm(w,false)))return '<span class="miss" title="악센트">'+esc(w)+'</span>';
    return '<span class="miss">'+esc(w)+'</span>';
  }).join('');
}
function similarity(a,b){
  const A=norm(a,false).split(' ').filter(Boolean),B=norm(b,false).split(' ').filter(Boolean);
  if(!B.length)return 0;let hit=0;const pool=A.slice();
  B.forEach(w=>{const i=pool.indexOf(w);if(i>-1){hit++;pool.splice(i,1)}});
  return hit/Math.max(B.length,A.length);
}

// ---------- 음성 ----------
const hasTTS='speechSynthesis' in window;
let voices=[];
function loadVoices(){if(!hasTTS)return;voices=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang))}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(tab==='list')render()}}
// 소리가 안 날 때: 음성 목록 다시 읽기 + 멈춘 엔진 깨우기 + 2.5초 안에 시작 안 하면 안내
let ttsWarned=false;
function ttsGuard(u){
  if(!voices.length)loadVoices();
  try{speechSynthesis.resume()}catch(e){}
  let started=false;const prev=u.onstart;u.onstart=e=>{started=true;prev&&prev(e)};
  setTimeout(()=>{if(started||ttsWarned)return;ttsWarned=true;
    toast(voices.length?'소리가 안 나오면 컴퓨터 볼륨·음소거와 브라우저 탭 음소거를 확인해 주세요':'이 컴퓨터에 프랑스어 음성이 없어요. Chrome이나 Edge로 열거나, 컴퓨터 설정에서 프랑스어 음성을 설치해 주세요',6000)},2500);
}
function speak(text,slow){
  if(!hasTTS){toast('이 브라우저는 음성 재생을 지원하지 않아요');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';
  const v=voices.find(v=>v.name===S.settings.voice)||voices.find(v=>/fr[-_]CI/i.test(v.lang))||voices.find(v=>/fr[-_]FR/i.test(v.lang))||voices[0];
  if(v){u.voice=v;u.lang=v.lang}
  u.rate=slow?0.55:S.settings.rate;
  ttsGuard(u);speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

// ---------- 기억용 그림 ----------
// 저장한 그림이 없으면 단어/뜻에서 자동으로 이모지 그림을 만들어요
const EMO=[
  [/\btaxi|voiture|gbaka|woro|택시|차를/,'🚕'],[/\bbus\b|버스/,'🚌'],[/marche\b|시장/,'🧺'],[/banane|alloco|plantain|바나나/,'🍌'],
  [/attieke|poisson|생선/,'🐟'],[/maquis|restaurant|manger|식당|먹/,'🍽️'],[/\bboire|\beau\b|물 /,'💧'],[/bissap|\bjus\b|주스/,'🧃'],
  [/\bcafe\b|커피/,'☕'],[/\bpain\b|빵/,'🥖'],[/poulet|닭/,'🍗'],[/\briz\b|쌀|밥/,'🍚'],[/mangue|ananas|fruit|망고|과일/,'🥭'],
  [/chaud|soleil|덥|햇/,'☀️'],[/pluie|pleut|비가|비 /,'🌧️'],[/froid|춥|추워/,'🥶'],
  [/argent|monnaie|coute|prix|franc|cfa|돈|얼마|잔돈/,'💰'],[/acheter|vendre|사다|팔아/,'🛍️'],
  [/maison|chez moi|집/,'🏠'],[/arrivee|bienvenue|환영|오셨/,'🤗'],[/bonjour|salut|bonsoir|안녕/,'👋'],[/merci|감사|고마/,'🙏'],
  [/pardon|desole|excuse|미안|죄송/,'🙇'],[/ce soir|\bnuit|\bsoir\b|저녁|밤/,'🌙'],[/matin|아침/,'🌅'],[/dormir|sommeil|잠|자요/,'😴'],
  [/travail|bureau|travailler|일하|회사/,'💼'],[/ecole|apprendre|etudier|francais|학교|공부|배우/,'📚'],[/livre|책/,'📖'],
  [/telephone|appeler|전화/,'📱'],[/medecin|malade|hopital|pharmacie|병원|아프|약국/,'🏥'],[/plage|\bmer\b|바다|해변/,'🏖️'],
  [/\bami|copain|친구/,'🧑‍🤝‍🧑'],[/famille|enfant|가족|아이/,'👨‍👩‍👧'],[/aimer|amour|aime|사랑|좋아/,'❤️'],
  [/coree|coreen|한국/,'🇰🇷'],[/abidjan|cocody|plateau|yopougon|cote d'ivoire|ivoirien|아비장|코트디부아르|코코디/,'🇨🇮'],

function autoEmoji(fr,ko){
  const s=(fr||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/’/g,"'")+' '+(ko||'');
  const hits=[];for(const [re,e] of EMO){if(re.test(s)&&!hits.includes(e))hits.push(e);if(hits.length>=3)break}
  return hits.join('');
}
function imgOf(it){
  if(it.img)return it.img.t==='none'?null:it.img;
  const a=autoEmoji(it.fr,it.ko);return a?{t:'emoji',v:a}:null;
}
function picHtml(im,cls){
  if(!im)return '';
  if(im.t==='emoji')return `<div class="pic ${cls}">${esc(im.v)}</div>`;
  return `<div class="pic ${cls}"><img src="${esc(im.v)}" alt="" loading="lazy" referrerpolicy="no-referrer"></div>`;
}
function thumb(it){
  const im=imgOf(it);

  return `<button class="pic s" data-pic="${it.id}" title="그림 바꾸기">${im.t==='emoji'?esc(im.v):`<img src="${esc(im.v)}" alt="" loading="lazy" referrerpolicy="no-referrer">`}</button>`;
}
const STOP=new Set('le la les l un une des de du d au aux a et est je tu il elle on nous vous ils elles ce c ca se s me m te t en y ne n pas que qu qui pour par sur dans avec mon ma mes ton ta tes son sa ses tres plait voudrais suis es sont fait'.split(' '));
function keyTerm(fr){
  const w=norm(fr,false).replace(/'/g,' ').split(' ').filter(x=>x.length>1&&!STOP.has(x));
  return (w.sort((a,b)=>b.length-a.length)[0]||norm(fr,false));
}
async function searchCommons(term){
  const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=16'
    +'&gsrsearch='+encodeURIComponent('filetype:bitmap '+term)+'&prop=imageinfo&iiprop=url&iiurlwidth=320';
  const d=await (await fetch(u)).json();
  return Object.values(d.query?.pages||{}).sort((a,b)=>a.index-b.index).map(p=>p.imageinfo?.[0]?.thumburl).filter(Boolean);
}
function fileToData(f){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{
    const m=360,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.75))};img.onerror=rej;img.src=URL.createObjectURL(f)});
}

  const playBtns=`<div class="play"><button class="btn" data-say="${esc(it.fr)}">🔊 듣기</button><button class="btn" data-say="${esc(it.fr)}" data-slow="1">🐢 천천히</button></div>`;

  let body='';
  if(q.type==='spell')body=`${picHtml(im,'l')}<div class="muted">이 뜻을 불어로 쓰세요</div><div class="prompt">${esc(it.ko)}</div>
    <input type="text" id="a1" data-fr placeholder="불어로 입력" autocomplete="off" autocapitalize="off" spellcheck="false">${accBar()}`;
  if(q.type==='dict')body=`<div class="muted">잘 듣고 들리는 불어를 그대로 쓰세요</div>${playBtns}${hint}
    <input type="text" id="a1" data-fr placeholder="들은 불어 입력" autocomplete="off" autocapitalize="off" spellcheck="false">${accBar()}`;
  if(q.type==='both')body=`<div class="muted">문장은 보이지 않아요. 듣고 <b>뜻</b>과 <b>불어</b>를 모두 쓰세요</div>${playBtns}${hint}
    <label class="f">한국어 뜻</label><input type="text" id="a2" placeholder="무슨 뜻일까요?" autocomplete="off">
    <label class="f">불어</label><input type="text" id="a1" data-fr placeholder="들은 불어 입력" autocomplete="off" autocapitalize="off" spellcheck="false">${accBar()}`;
  if(q.type==='speak')body=`${picHtml(im,'m')}<div class="muted">① 소리 내어 읽고 → ② 원어민 소리 듣고 → ③ 따라 말하기</div>
    <div class="prompt">${esc(it.fr)}</div><div class="muted" style="margin:-8px 0 8px">${esc(it.ko)}</div>${playBtns}
    ${SR?`<button class="btn big mic" id="mic">🎤 눌러서 말하기</button><div class="muted" id="heard" style="margin-top:8px"></div>`
        :`<div class="muted" style="margin-bottom:8px">이 브라우저는 음성 인식이 안 돼요 (Chrome 추천). 스스로 평가해 주세요.</div>
          <div class="row"><button class="btn" id="selfno" style="flex:1">😓 어려웠어요</button><button class="btn" id="selfok" style="flex:1">😀 잘 말했어요</button></div>`}`;
  $('#view').innerHTML=`
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="muted">${T.wrongOnly?'📕 오답 복습':T.session==='morning'?'☀️ 아침 테스트':'🌙 저녁 테스트'} · ${T.i+1} / ${T.qs.length}</span>
      <button class="btn sm" id="quit">그만하기</button></div>
    <div class="bar"><i style="width:${T.i/T.qs.length*100}%"></i></div>
    <div class="qtype">${tn}</div>
    ${body}
    <div id="fb"></div>
    <div style="margin-top:14px"><button class="btn pri big" id="act">${q.type==='speak'?'건너뛰기':'확인'}</button></div>
  </div>`;
  T.answered=false;
  const hb=$('#hintb');if(hb)hb.onclick=()=>{$('#hint').classList.remove('hide');hb.remove();(a2||a1)?.focus()};
  $('#quit').onclick=()=>{if(confirm('테스트를 끝낼까요? 지금까지 결과는 저장돼요.'))finish()};
  const a1=$('#a1'),a2=$('#a2');
  if(q.type==='dict'||q.type==='both')setTimeout(()=>speak(it.fr),250);
  (a2||a1)?.focus();
  if(a2)a2.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();a1.focus()}};
  if(a1)a1.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();act()}};
  $('#act').onclick=act;
  function act(){
    if(T.answered)return next();
    if(q.type==='speak')return answer(false,{heard:''},'건너뜀');
    const r=gradeFr(a1.value,it.fr);
    let ok=r.ok,koOk=true;
    if(q.type==='both'){koOk=gradeKo(a2.value,it.ko);ok=ok&&koOk}
    answer(ok,{fr:a1.value,ko:a2?.value,frOk:r.ok,koOk,note:r.note});
  }
  if(q.type==='speak'){
    if(SR){
      const mic=$('#mic');let rec=null;
      mic.onclick=()=>{
        if(T.answered)return;
        if(rec){rec.stop();return}
        speechSynthesis?.cancel();
        rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.maxAlternatives=3;
        let best='';
        rec.onresult=e=>{const r=e.results[e.results.length-1];best=r[0].transcript;
          for(const alt of r){if(similarity(alt.transcript,it.fr)>similarity(best,it.fr))best=alt.transcript}
          $('#heard').textContent='들린 말: '+best};
        rec.onerror=e=>{toast(e.error==='not-allowed'?'마이크 권한을 허용해 주세요':'인식 실패, 다시 해보세요')};
        rec.onend=()=>{mic.classList.remove('rec');mic.textContent='🎤 다시 말하기';rec=null;
          if(best){const s=similarity(best,it.fr);answer(s>=0.75,{heard:best,sim:s})}};
        rec.start();mic.classList.add('rec');mic.textContent='⏹ 듣는 중… (누르면 끝)';
      };

      $('#selfok').onclick=()=>answer(true,{self:true});
      $('#selfno').onclick=()=>answer(false,{self:true});
    }
  }
  function answer(ok,info){

    document.querySelectorAll('#view input').forEach(i=>i.disabled=true);
    const fb=$('#fb');
    let detail='';
    if(q.type==='speak'){
      detail=info.heard?`<div>들린 말: <i>${esc(info.heard)}</i> (${Math.round((info.sim||0)*100)}% 일치)</div>`:'';
    }else{
      detail=`${q.type!=='spell'&&!$('#hint:not(.hide)')?picHtml(im,'m'):''}<div style="margin-top:6px">정답:<b>${info.frOk?esc(it.fr):diffHtml(info.fr,it.fr)}</b> <button class="ib" data-say="${esc(it.fr)}">🔊</button></div>
        <div>뜻: ${esc(it.ko)}</div>
        <div class="muted" style="margin-top:6px">내 답: ${esc(info.fr)||'(빈칸)'}${q.type==='both'?` / 뜻: ${esc(info.ko)||'(빈칸)'} ${info.koOk?'✓':'✗'}`:''}</div>
        ${info.note?`<div style="margin-top:6px">⚠️ ${info.note}</div>`:''}`;
    }
    fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?'정답! 🎉':'아쉬워요 — 오답노트에 저장할게요'}</h3>${detail}
      ${!ok&&!info.self?`<div style="margin-top:10px"><button class="btn sm" id="ovr">사실 맞았어요 (비슷한 뜻 등)</button></div>`:''}</div>`;
    const ovr=$('#ovr');if(ovr)ovr.onclick=()=>{T.cur.ok=true;fb.querySelector('.fb').className='fb ok';fb.querySelector('h3').textContent='맞은 걸로 처리했어요 ✓';ovr.remove()};
    if(!ok&&q.type!=='speak')speak(it.fr);
    $('#act').textContent=T.i+1<T.qs.length?'다음 →':'결과 보기';
    $('#act').focus();
  }
}
function record(r){
  const it=byId(r.id);if(!it)return;
  T.res.push(r);
  if(r.ok){it.right++;const w=S.wrong[r.id];if(w){w.streak=(w.streak||0)+1;if(w.streak>=2){delete S.wrong[r.id];r.cleared=true}}}
  else{it.wrong++;const w=S.wrong[r.id]||{count:0};w.count++;w.streak=0;w.last=today();S.wrong[r.id]=w}
  save();
}
function next(){record(T.cur);T.cur=null;T.i++;if(T.i>=T.qs.length)finish();else vQuestion()}
function finish(){
  if(T.cur&&T.answered){record(T.cur);T.cur=null}
  T.done=true;
  const score=T.res.filter(r=>r.ok).length;
  if(T.session&&T.res.length){const l=S.log[today()]||(S.log[today()]={});l[T.session]={score,total:T.res.length}}
  if(T.res.length)S.history.push({d:today(),at:timeNow(),s:T.session||'review',score,total:T.res.length,wrong:[...new Set(T.res.filter(r=>!r.ok).map(r=>r.id))]});
  save();renderNav();vResult();
}
function vResult(){
  const score=T.res.filter(r=>r.ok).length,tot=T.res.length,wrongs=T.res.filter(r=>!r.ok),cleared=T.res.filter(r=>r.cleared);

  <div class="card" style="text-align:center"><div class="muted">${T.wrongOnly?'📕 오답 복습':T.session==='morning'?'☀️ 아침 테스트':'🌙 저녁 테스트'} 결과</div>
    <div class="score">${score} / ${tot}</div>
    <div>${tot&&score===tot?'완벽해요! Bravo ! 👏':score/tot>=.7?'잘했어요! Très bien !':'괜찮아요, 틀린 건 오답노트에서 다시 봐요 💪'}</div>
    ${cleared.length?`<div class="muted" style="margin-top:6px">✨ ${cleared.length}개가 오답노트에서 졸업했어요 (2번 연속 정답)</div>`:''}

  <div class="row">${wrongs.length?`<button class="btn pri" id="again" style="flex:1">📕 틀린 것만 다시</button>`:''}<button class="btn" id="home" style="flex:1">🏠 홈으로</button></div>`;
  document.querySelectorAll('[data-del]').forEach(b=>b.remove());
  const ag=$('#again');if(ag)ag.onclick=()=>startTest(true);

const PW_DEFAULT='35e15356'; // 기본 비밀번호의 해시값 (원래 숫자는 코드에 남기지 않아요)

const shiftD=(d,n)=>{const [y,m,dd]=d.split('-').map(Number);return dstr(new Date(y,m-1,dd+n))};
const timeNow=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};

// ---------- 🎧 스피킹 1시간: 듣고 → 따라 말하고 → 듣고 → 따라 말하고 ----------
var SP=null,spTick=null,wakeLock=null;
const PAUSE={short:1.0,mid:1.5,long:2.2};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const spGet=(d=today())=>S.speak[d]||{sec:0,reps:0,by:{}};
const spDay=(d=today())=>S.speak[d]||(S.speak[d]={sec:0,reps:0,by:{}});
function saidTotal(id){let n=0;for(const d in S.speak)n+=((S.speak[d].by||{})[id]||0);return n}
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);

// 소리 재생이 끝날 때까지 기다리고, 걸린 시간을 돌려줘요 (따라 말할 시간 계산용)
function speakP(text,slow,who){
  return new Promise(res=>{
    const t0=Date.now();
    if(!hasTTS){setTimeout(()=>res(1500),1500);return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';
    const v=voices.find(v=>v.name===S.settings.voice)||voices.find(v=>/fr[-_]CI/i.test(v.lang))||voices.find(v=>/fr[-_]FR/i.test(v.lang))||voices[0];
    if(v){u.voice=v;u.lang=v.lang}
    if(who){const v2=voices.find(x=>x!==v&&/fr[-_]FR/i.test(x.lang))||voices.find(x=>x!==v);if(v2){u.voice=v2;u.lang=v2.lang}else u.pitch=1.4} // 대화의 두 번째 사람은 다른 목소리
    u.rate=slow?0.6:S.settings.rate;
    let done=false;
    const fin=()=>{if(done)return;done=true;clearTimeout(t);res(Math.max(800,Date.now()-t0))};
    u.onend=fin;u.onerror=fin;
    const t=setTimeout(fin,text.length*(slow?170:110)+4000);
    ttsGuard(u);speechSynthesis.speak(u);
  });
}
// 내 목소리를 듣고 문장과 얼마나 비슷한지 확인해요
function listenFor(target,ms){
  return new Promise(res=>{
    let best='',done=false,rec,t;
    const fin=()=>{
      if(done)return;done=true;clearTimeout(t);try{rec&&rec.abort()}catch(_){}
      if(SP)SP.rec=null;
      const sim=similarity(best,target);res({heard:best,sim,ok:sim>=0.5});
    };
    try{rec=new SR()}catch(_){res({heard:'',sim:0,ok:true});return}
    rec.lang='fr-FR';rec.interimResults=true;rec.maxAlternatives=1;
    rec.onresult=e=>{
      best=Array.from(e.results).map(r=>r[0].transcript).join(' ').trim();
      if(SP)SP.heard=best;const h=$('#spheard');if(h)h.textContent='들린 말: '+best;
      if(e.results[e.results.length-1].isFinal)setTimeout(fin,150);
    };
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){if(SP)SP.micDenied=true}fin()};
    rec.onend=fin;
    t=setTimeout(fin,ms);
    if(SP)SP.rec=rec;
    try{rec.start()}catch(_){fin()}
  });
}
function waitOrSkip(ms){return new Promise(res=>{const t=setTimeout(res,ms);if(SP)SP.wake=()=>{clearTimeout(t);res()}})}
function spCountdown(ms){
  const i=$('#spcd');if(!i)return;
  i.style.transition='none';i.style.width='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.transition=`width ${ms}ms linear`;i.style.width='100%'}));
}
function spQueue(){
  const c=S.settings.sp;let list=S.items.slice();
  if(c.scope==='today')list=list.filter(x=>x.added===today());
  else if(c.scope==='week')list=list.filter(x=>x.added>=daysAgo(6));
  else if(c.scope==='wrong')list=list.filter(x=>S.wrong[x.id]);
  else if(c.scope==='pack')return packIds().map((id,i)=>[id,saidTotal(id),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(a=>a[0]); // 필수 100: 순서대로, 적게 말한 것부터
  list=shuffle(list);
  // 적게 말한 것부터 (오답노트에 있는 건 더 앞으로)
  if(c.scope==='least'){const score=x=>saidTotal(x.id)-(S.wrong[x.id]?50:0);list.sort((a,b)=>score(a)-score(b))}
  return list.map(x=>x.id);
}
function spCount(id){
  const d=spDay();d.reps++;d.by=d.by||{};d.by[id]=(d.by[id]||0)+1;
  save();spGoalCheck();
}
function spGoalCheck(){
  const d=spGet(),c=S.settings.sp;
  if(SP&&!SP.celebrated&&d.sec>=c.goalMin*60&&d.reps>=c.goalReps){SP.celebrated=true;toast('🎉 오늘 스피킹 분량 완료! Bravo !')}
}
function spSecond(){
  if(!(SP&&SP.running&&document.visibilityState==='visible'))return;
  const d=spDay(),c=S.settings.sp;d.sec++;
  if(d.sec%20===0)save();
  const t=$('#sptime');if(t)t.textContent=mmss(d.sec);
  const b=$('#spbar');if(b)b.style.width=Math.min(100,d.sec/(c.goalMin*60)*100)+'%';
  spGoalCheck();
}
function spAdvance(){SP.rep=0;SP.qi++;if(SP.qi>=SP.queue.length){SP.queue=spQueue();SP.qi=0}}
function spInterrupt(){
  if(!SP)return;SP.token=(SP.token||0)+1;
  if(hasTTS)speechSynthesis.cancel();
  try{SP.rec&&SP.rec.abort()}catch(_){}
  SP.wake&&SP.wake();
}
async function spLoop(){
  const my=SP.token=(SP.token||0)+1;
  const alive=()=>SP&&SP.running&&SP.token===my;
  while(alive()){
    const it=byId(SP.queue[SP.qi]);
    if(!it){spAdvance();if(!SP.queue.length){spEnd();render();return}continue}
    const c=S.settings.sp;
    SP.phase='listen';SP.heard='';SP.sim=null;spDraw();
    const dur=await speakP(it.fr,c.slowFirst&&SP.rep===0);
    if(!alive())return;
    SP.phase='speak';spDraw();
    const wait=Math.round(Math.max(2200,dur*PAUSE[c.pause]+700));
    spCountdown(wait);
    let r;
    if(c.mode==='mic'&&SR&&!SP.micDenied)r=await listenFor(it.fr,wait+1500);
    else{await waitOrSkip(wait);r={ok:true,heard:''}}
    if(!alive())return;
    if(SP.micDenied&&c.mode==='mic'){c.mode='auto';save();toast('마이크를 쓸 수 없어서 ⏱️ 자동 진행으로 바꿨어요');r.ok=true}
    if(SP.manual){SP.manual=false;r.ok=true}
    SP.sim=r.sim;
    if(r.ok){spCount(it.id);SP.rep++;SP.phase='good'}else SP.phase='again';
    spDraw();
    await sleep(r.ok?450:1000);
    if(!alive())return;
    if(SP.rep>=c.reps)spAdvance();
  }
}
async function spStart(){
  const q=spQueue();
  if(!q.length){toast('연습할 표현이 없어요. "연습할 문장" 범위를 바꿔보세요');return}
  SP={queue:q,qi:0,rep:0,running:true,phase:'listen',heard:'',celebrated:false};
  const d=spGet(),c=S.settings.sp;if(d.sec>=c.goalMin*60&&d.reps>=c.goalReps)SP.celebrated=true;
  try{wakeLock=await navigator.wakeLock?.request('screen')}catch(_){} // 화면 꺼짐 방지
  if(!spTick)spTick=setInterval(spSecond,1000);
  spDraw();spLoop();
}
function spEnd(){
  if(!SP)return;
  SP.running=false;spInterrupt();SP=null;save();
  try{wakeLock&&wakeLock.release()}catch(_){}wakeLock=null;
}
function spToggle(){
  if(!SP)return;
  if(SP.running){SP.running=false;spInterrupt();save();spDraw()}
  else{SP.running=true;spDraw();spLoop()}
}
function spManual(){if(SP&&SP.running&&SP.phase==='speak'){SP.manual=true;try{SP.rec&&SP.rec.abort()}catch(_){}SP.wake&&SP.wake()}}
function spSkip(){if(!SP)return;spInterrupt();spAdvance();if(SP.running)spLoop();else spDraw()}
document.addEventListener('keydown',e=>{
  if(tab!=='speak'||!SP||(e.target.matches&&e.target.matches('input,textarea')))return;
  if(e.code==='Space'){e.preventDefault();spToggle()}
  else if(e.key==='Enter'){e.preventDefault();spManual()}
  else if(e.key==='ArrowRight'){e.preventDefault();spSkip()}
});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&SP&&!wakeLock){try{wakeLock=await navigator.wakeLock?.request('screen')}catch(_){}}});

function spDraw(){

    <div class="bar" style="margin:6px 0 4px"><i id="spbar" style="width:${Math.min(100,d.sec/(c.goalMin*60)*100)}%;background:var(--good)"></i></div>

    <div class="big-fr" style="text-align:center">${reveal?esc(it.fr):'👂 · · ·'}</div>${reveal&&it.pron?`<div class="pron big" style="text-align:center">[ ${esc(it.pron)} ]</div>`:''}
    <div class="muted" style="text-align:center">${reveal?esc(it.ko):'문장은 숨겨져 있어요. 소리만 듣고 따라 해보세요'}</div>${reveal&&it.note?`<div class="note" style="text-align:center">💡 ${esc(it.note)}</div>`:''}
    <div class="dots">${Array.from({length:c.reps},(_,i)=>`<i class="${i<SP.rep?'on':i===SP.rep?'cur':''}"></i>`).join('')}</div>
    <div class="phase ${ph[0]}">${ph[1]}</div>

  </div>`;

<li><b>동사 두 개면 뒤는 원형</b> — Je veux <b>partager</b>(나누고 싶다) · Je peux <b>venir</b>(올 수 있다) · Je vais <b>prier</b>(기도할게요 = 가까운 미래) · pour <b>aimer</b>(사랑하기 위해).</li>
<li><b>'나를/당신을'은 동사 앞에</b> — Dieu <b>vous</b> aime(하나님이 당신을 사랑해요) · Je <b>t'</b>aime · Dieu <b>m'</b>a donné(나에게 주셨다). 명령할 때만 뒤로: Aide-<b>moi</b> !</li>
<li><b>축약과 연음</b> — 모음 앞에서 je → j', le/la → l', de → d', ne → n'. 원래 소리 안 나는 끝 자음이 뒤 모음과 이어지기도 해요: vous avez → '부 자베', les enfants → '레 장팡'.</li>
<li><b>형용사는 보통 명사 뒤 + 여성이면 e</b> — une église missionnaire(선교하는 교회), la vie éternelle. content → contente, fatigué → fatiguée. (bon, beau, grand, petit 같은 짧은 형용사는 명사 앞)</li>
</ol>
<div class="muted" style="font-size:13px">표현마다 💡 부분에 '왜 이렇게 쓰였는지'를 짧게 적어 뒀어요. 문법은 이 정도만 알고, 나머지는 문장을 통째로 입에 붙이는 게 제일 빨라요.</div>
</details>`;

function bindPack(){

}

function opts5(right,pool){const o=[right];for(const x of shuffle(pool)){if(o.length>=5)break;if(!o.includes(x))o.push(x)}return shuffle(o)}
function lMake(n){
  const it=[...Object.values(PITEMS),...S.items.filter(x=>!PITEMS[x.id])];
  const sent=it.filter(x=>x.kind==='문장'&&x.ko),word=it.filter(x=>x.pack==='w');
  const withPic=word; // 그림 문제는 그림이 뜻을 딱 하나로 보여 주는 기초 단어만 써요
  const per=Math.ceil(n/6),Q=[];
  // 🖼️ 그림 (단어·문장 섞어서, 그림이 서로 다른 것만)
  pick(withPic,per*3).forEach(x=>{if(Q.filter(q=>q.t==='pic').length>=per)return;const e=imgOf(x).v,others=[...new Set(withPic.map(y=>imgOf(y).v).filter(v=>v!==e))];if(others.length<4)return;Q.push({t:'pic',say:[x.fr],ans:e,opts:opts5(e,others),fr:[x.fr],ko:[x.ko],pron:x.pron,id:x.id})});
  // 🎧 뜻
  pick(sent,per).forEach(x=>{const dis=[...new Set(sent.filter(y=>y.ko!==x.ko).map(y=>y.ko))];Q.push({t:'mean',say:[x.fr],ans:x.ko,opts:opts5(x.ko,dis),fr:[x.fr],ko:[x.ko],pron:x.pron,id:x.id})});
  // 💬 대답
  pick(LQA,per).forEach(([q,a,qk,ak,k])=>{const dis=LQA.filter(z=>z[4]!==k).map(z=>z[1]);Q.push({t:'reply',say:[q],ans:a,opts:opts5(a,dis),fr:[q,a],ko:[qk,ak],fropt:true})});
  // 📍 장소 / 🔎 세부
  pick(LDIA,per*2).forEach((d,i)=>{const lines={say:d.lines,fr:d.lines,ko:d.ko,dia:true};
    if(i%2===0)Q.push({...lines,t:'place',ans:d.at,opts:opts5(d.at,LDIA.map(z=>z.at)),qtext:'이 대화는 어디에서 하는 대화일까요?'});
    else Q.push({...lines,t:'detail',ans:d.a,opts:shuffle([d.a,...d.x]),qtext:d.q})});
  // 📚 주제 / 🔎 세부
  pick(LMONO,per*2).forEach((m,i)=>{const lines={say:m.lines,fr:m.lines,ko:m.ko};
    if(i%2===0)Q.push({...lines,t:'topic',ans:m.topic,opts:opts5(m.topic,LMONO.map(z=>z.topic)),qtext:'이 이야기의 주제는 무엇일까요?'});
    else Q.push({...lines,t:'detail',ans:m.a,opts:shuffle([m.a,...m.x]),qtext:m.q})});
  return shuffle(Q).slice(0,n);
}

var snap=null,syncTimer=null,syncing=false,syncAgain=false,syncState='off',renderLater=false;
const SK='frstudy.sync';
var SYNC=(()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(_){return {}}})();
function saveSync(){try{localStorage.setItem(SK,JSON.stringify(SYNC))}catch(_){}}
const syncOn=()=>!!(SYNC.repo&&SYNC.token);

function parts(s){
  const p={};
  (s.items||[]).forEach(x=>p['item:'+x.id]=JSON.stringify(x));
  for(const d in s.todos||{})p['todos:'+d]=JSON.stringify(s.todos[d]);
  for(const d in s.diary||{})p['diary:'+d]=JSON.stringify(s.diary[d]);
  for(const d in s.log||{})p['log:'+d]=JSON.stringify(s.log[d]);
  for(const d in s.speak||{})p['speak:'+d]=JSON.stringify(s.speak[d]);
  p.wrong=JSON.stringify(s.wrong||{});p.settings=JSON.stringify(s.settings||{});
  return p;
}
function stampChanges(){
  const now=Date.now(),cur=parts(S);S.stamp=S.stamp||{};
  if(snap){for(const k in cur)if(cur[k]!==snap[k])S.stamp[k]=now;for(const k in snap)if(!(k in cur))S.stamp[k]=now}
  snap=cur;
}
function onSaved(){
  stampChanges();
  if(!syncOn())return;
  const drilling=typeof SP!=='undefined'&&SP&&SP.running;
  if(drilling&&syncTimer)return; // 스피킹 중에는 1분에 한 번만 올려요
  clearTimeout(syncTimer);setSync('wait');
  syncTimer=setTimeout(()=>{syncTimer=null;syncNow()},drilling?60000:4000);
}
function rebuild(p,base){
  const s={...base,items:[],todos:{},diary:{},log:{},speak:{},wrong:{},settings:{}};
  for(const k in p){
    const v=JSON.parse(p[k]);
    if(k==='wrong'){s.wrong=v;continue}if(k==='settings'){s.settings=v;continue}
    const i=k.indexOf(':'),t=k.slice(0,i),id=k.slice(i+1);
    if(t==='item')s.items.push(v);else if(t==='todos')s.todos[id]=v;else if(t==='diary')s.diary[id]=v;else if(t==='log')s.log[id]=v;else if(t==='speak')s.speak[id]=v;
  }
  s.items.sort((a,b)=>a.added<b.added?-1:a.added>b.added?1:0);
  return s;
}
function merge(L,R){
  const pl=parts(L),pr=parts(R),sl=L.stamp||{},sr=R.stamp||{},out={},st={};
  const keys=new Set([...Object.keys(pl),...Object.keys(pr),...Object.keys(sl),...Object.keys(sr)]);
  for(const k of keys){
    const a=sl[k]||0,b=sr[k]||0,src=(b>a||(b===a&&!(k in pl)))?pr:pl;
    if(k in src)out[k]=src[k];
    st[k]=Math.max(a,b);
  }
  const s=rebuild(out,L);s.stamp=st;
  const seen=new Set();
  s.history=[...(L.history||[]),...(R.history||[])].filter(h=>{const id=JSON.stringify(h);if(seen.has(id))return false;seen.add(id);return true})
    .sort((a,b)=>(a.d+a.at)<(b.d+b.at)?-1:(a.d+a.at)>(b.d+b.at)?1:0);
  return s;
}
const sig=s=>{const p=parts(s);return Object.keys(p).sort().map(k=>k+'='+p[k]).join('\n')+'#'+(s.history||[]).length};

}
async function pull(){
  const r=await api('GET');
  if(r.status===404)return {data:null,sha:null};
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();
  let text=j.content?dec(j.content):'';
  if(!text){const r2=await api('GET',null,true);if(!r2.ok)throw new Error(String(r2.status));text=await r2.text()}
  return {data:JSON.parse(text),sha:j.sha};
}
async function push(sha){
  const body={message:'기록 동기화 '+today()+' '+timeNow(),content:enc(JSON.stringify(S))};if(sha)body.sha=sha;
  const r=await api('PUT',body);
  if(r.status===409||r.status===422)return false; // 다른 기기가 방금 저장함 → 다시 받아서 합치기
  if(!r.ok)throw new Error(String(r.status));
  return true;
}
const syncMsg=e=>e.message==='401'?'토큰이 틀렸거나 만료됐어요':e.message==='403'?'토큰에 쓰기 권한이 없어요 (Contents: Read and write)':e.message==='404'?'기록 저장소를 찾을 수 없어요':'인터넷 연결을 확인하세요';
async function syncNow(manual){
  if(!syncOn())return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSync('busy');
  try{
    let done=false;
    for(let i=0;i<4&&!done;i++){
      const {data,sha}=await pull();
      const before=sig(S);
      let next=S;
      if(data){if(!data.stamp)data.stamp={};next=(!SYNC.joined&&isFresh(S))?data:merge(S,data)}
      S=next;fix();snap=parts(S);
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}
      if(!SYNC.joined){SYNC.joined=true;saveSync()}
      done=(data&&sig(data)===sig(S))?true:await push(sha);
      if(sig(S)!==before)softRender();
    }
    setSync(done?'ok':'err');
    if(manual)toast(done?'동기화했어요 ☁️':'동기화 충돌 — 잠시 뒤 다시 해보세요');
  }catch(e){setSync('err');SYNC.lastErr=syncMsg(e);if(manual)toast('동기화 실패: '+syncMsg(e))}
  syncing=false;
  if(syncAgain){syncAgain=false;syncNow()}
}
// 입력 중이거나 테스트 중이면 화면을 바로 바꾸지 않아요
function softRender(){
  if((T&&!T.done)||(typeof SP!=='undefined'&&SP)||(typeof L!=='undefined'&&L)){renderLater=true;return}
  const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea')){renderLater=true;return}
  renderLater=false;render();
}
document.addEventListener('focusout',()=>{if(renderLater)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches('input,textarea'))&&!(T&&!T.done)&&renderLater){renderLater=false;render()}},300)});
function setSync(s){
  syncState=s;
  const m={off:['',''],wait:['⏳','저장 대기 중'],busy:['🔄','동기화 중'],ok:['☁️','모든 기기와 동기화됨'],err:['⚠️','동기화 실패'+(SYNC.lastErr?' — '+SYNC.lastErr:'')]}[s]||['',''];
  const el=$('#sync');if(el){el.textContent=m[0];el.title=m[1]}
  const st=$('#syst');if(st)st.textContent=m[1]?'· '+m[1]:'';
}
$('#sync').onclick=()=>{if(T&&!T.done)return;go('list');setTimeout(()=>$('#sycard')?.scrollIntoView({behavior:'smooth'}),50)};
document.addEventListener('visibilitychange',()=>{
  if(!syncOn())return;
  if(document.visibilityState==='visible')syncNow();
  else if(syncTimer){clearTimeout(syncTimer);syncTimer=null;syncNow()} // 앱을 닫기 전에 바로 올리기
});
setInterval(()=>{if(syncOn()&&document.visibilityState==='visible'&&!syncTimer)syncNow()},90000);

function syncCard(){
  if(syncOn())return `<div class="card" id="sycard"><h2>☁️ 기기 간 동기화</h2>
    <div>연결됨: <b>${esc(SYNC.repo)}</b> <span class="muted" id="syst"></span></div>
    <div class="muted" style="margin-top:4px">이 기기에서 저장하면 몇 초 뒤 자동으로 올라가고, 다른 기기에서 앱을 열거나 다시 볼 때 자동으로 받아와요.</div>
    <div class="row" style="margin-top:10px"><button class="btn sm pri" id="synow">🔄 지금 동기화</button><button class="btn sm" id="syoff">이 기기 연결 끊기</button></div></div>`;
  return `<div class="card" id="sycard"><h2>☁️ 기기 간 동기화</h2>
    <div class="muted">컴퓨터·휴대폰 어디서 열어도 같은 기록을 보려면, 기록을 GitHub <b>비공개</b> 저장소에 저장해요. 기기마다 처음 한 번만 연결하면 돼요.</div>
    <ol class="muted" style="padding-left:18px;margin:8px 0">
      <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 토큰 만들기</a> → Repository access: <b>Only select repositories</b> → <b>language-data</b></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
      <li>Generate token → 나온 토큰(github_pat_…)을 아래에 붙여넣기</li></ol>
    <label class="f">기록 저장소</label><input type="text" id="syrepo" value="${esc(SYNC.repo||'shgudtn1-byte/language-data')}" autocapitalize="off" spellcheck="false">
    <label class="f">토큰</label><input type="password" id="sytok" placeholder="github_pat_…" autocomplete="off">
    <button class="btn pri" id="syon" style="margin-top:10px">연결하기</button>
    <div class="muted" style="margin-top:8px">토큰은 이 기기 브라우저에만 저장돼요. 기록 저장소 하나만 쓸 수 있게 만들면 안전해요.</div></div>`;
}
function bindSyncCard(){
  const on=$('#syon');
  if(on)on.onclick=async()=>{
    const repo=$('#syrepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$|\/$/g,''),token=$('#sytok').value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return toast('저장소와 토큰을 확인하세요');
    on.disabled=true;on.textContent='확인 중…';
    try{
      const r=await fetch('https://api.github.com/repos/'+repo,{cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
      if(r.status===401)throw new Error('토큰이 올바르지 않아요');
      if(r.status===404||r.status===403)throw new Error('저장소를 찾을 수 없거나 토큰에 이 저장소 권한이 없어요');
      if(!r.ok)throw new Error('GitHub 오류 '+r.status);
      const j=await r.json();
      if(!j.private&&!confirm('⚠️ 이 저장소는 공개 저장소예요. 일기가 누구에게나 보일 수 있어요. 그래도 연결할까요?'))throw new Error('연결을 취소했어요');
      SYNC={repo,token,joined:false};SYNC.lastErr='';saveSync();
      await syncNow(true);
      if(syncState==='err'){const msg=SYNC.lastErr;SYNC={};saveSync();setSync('off');throw new Error(msg||'연결 실패')}
      render();
    }catch(e){toast(e.message);on.disabled=false;on.textContent='연결하기'}
  };
  const n=$('#synow');if(n)n.onclick=()=>syncNow(true);
  const off=$('#syoff');if(off)off.onclick=()=>{if(!confirm('이 기기의 동기화 연결을 끊을까요? (이 기기와 클라우드의 기록은 지워지지 않아요)'))return;SYNC={};saveSync();setSync('off');render()};
}

if(location.hash==='#admin')tab='admin';
snap=parts(S);
setSync(syncOn()?'busy':'off');
render();
if(syncOn())syncNow();
</script>
